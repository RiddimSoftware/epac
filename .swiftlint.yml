# SwiftLint configuration for the epac iOS app.
#
# Why this exists: with multiple developers shipping in parallel, automatic
# style enforcement catches the things review reliably misses (force-unwraps
# slipping in under deadline, files that grew past the point of usefulness).
# CI runs `swiftlint --strict` so warnings are also blocking.
#
# Tuning principles:
#   - Errors only on issues that are real bugs in waiting (force_cast,
#     force_try) or actual style breaks.
#   - Warnings on size / shape signals that often have a legitimate exception
#     (long view bodies in SwiftUI, the inevitable 60-line if/else over
#     model state). Authors silence per-line with
#     `// swiftlint:disable:next <rule> -- <reason>` rather than relaxing
#     the project default.
#   - Generated, vendored, and snapshot-test trees are excluded — they're
#     not ours to lint.

excluded:
  - .build
  - .git
  - DerivedData
  - ios/.build
  - ios/Pods
  - ios/epac/cabinet-positions.json
  - ios/epacTests/__Snapshots__
  - ios/fastlane
  - ios/epacUITests/SnapshotHelper.swift

included:
  - ios

disabled_rules:
  - trailing_whitespace        # The Xcode editor handles this automatically.
  - todo                       # TODOs are tracked in Jira; the lint warning is noise.
  - convenience_type           # Style preference (caseless enum vs static struct); the codebase mixes both deliberately.
  - large_tuple                # SwiftUI gradient/coordinate tuples are inherently > 3 elements.
  - switch_case_alignment      # Existing files use 1-tab indentation that conflicts with the default check; our diff style is fine.
  - identifier_name            # The codebase uses domain-meaningful suffixes (DateUtils `_en`/`_fr`, JSON-key locals like `LongTitleEn`) that don't fit the default rules; we rely on review to catch genuinely bad names.
  - line_length                # Long lines are dominated by SwiftUI modifier chains, NSLocalizedString keys, and URL strings — wrapping every one of those hurts readability more than the long line.
  - for_where                  # Several existing for-loops do work *and* short-circuit on a condition, where `for-where` would obscure intent.
  - multiple_closures_with_trailing_closure  # SwiftUI's `Button(action:label:)` and `.sheet(isPresented:onDismiss:content:)` patterns are the project standard.
  - vertical_parameter_alignment            # Existing function calls use either column-aligned or single-line styles; both are fine in review.
  - static_over_final_class                 # Two existing instances of `final class` for static-only ObservableObject hosts are intentional; converting to caseless enum loses the class identity SwiftUI watches.
  - function_body_length                    # Existing `body` views in SwiftUI legitimately exceed the default; the alternative is split-and-pass-bindings boilerplate.
  - function_parameter_count                # A handful of helper builders take many small primitives; review catches the ones that should be a struct.
  - file_length                             # 3 large files (ContentView, MembersView, LobbyingView) are tracked under separate split tickets; flagging here just generates noise on every unrelated PR.
  - type_body_length                        # Same reasoning as file_length.
  - type_name                               # The codebase has a few `_LeadingUnderscore` private helpers and a handful of intentional `lowercase_snake_case` local types from JSON decoding shims.
  - trailing_newline                        # Snapshot test PNGs and a few Swift files violate the missing/extra newline rule; not blocking for the baseline.
  - void_function_in_ternary                # One legacy site; rewriting now would touch unrelated code.

cyclomatic_complexity:
  warning: 5
  error: 5

opt_in_rules:
  - force_cast                  # Real bug-in-waiting; should be Result-returning APIs instead.
  - force_try                   # Same — surface failures explicitly.
  - empty_count                 # `isEmpty` is faster on lazy collections than `count == 0`.
  - sorted_imports              # Auto-fixable; reduces merge conflicts in import lists.
  - explicit_init               # Catches accidental `.init(...)` calls that hide the type.
  - redundant_nil_coalescing    # Catches `?? nil` no-ops.
  - closure_end_indentation     # Auto-fixable; keeps trailing closures aligned.
  # Architectural rules
  - private_swiftui_state       # @State must be private; leaking view state breaks encapsulation.
  - implicitly_unwrapped_optional # var x: T! is an init-order hack; use proper DI or lazy var instead.
  - private_over_fileprivate    # fileprivate leaks to the whole file; private is tighter.
  - superfluous_disable_command # Catches stale swiftlint:disable comments after violations are fixed.
  - discouraged_optional_boolean # Bool? is a tristate smell; use an explicit enum instead.
  - unowned_variable_capture    # [unowned self] crashes on dealloc; [weak self] is always safer.
  - no_magic_numbers            # Inline numeric literals should be named constants.

no_magic_numbers:
  # 0 and 1 appear legitimately throughout the codebase (zero-counts, single items,
  # identity values, boolean-like flags). Allow them explicitly so they don't flood
  # violations alongside the layout literals that EPAC-2003 is replacing with named
  # DesignSystem constants. Escalate severity to error after EPAC-2003 merges and
  # zero violations are confirmed.
  allowed_numbers: [0, 1]

custom_rules:
  application_layer_framework_imports:
    name: Application Layer Framework Imports
    included: "ios/epac/Application/.*\\.swift"
    regex: "^\\s*import\\s+(Foundation\\.URLSession|UIKit|SwiftData|SwiftUI)\\b"
    message: "This file is in the Application layer. Framework imports must move to ios/epac/Util/ or ios/epac/Views/. See docs/architecture/use-case-catalog.md."
    severity: error

reporter: "xcode"
