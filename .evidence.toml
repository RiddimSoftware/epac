# Evidence CLI configuration for epac.
# Used by `evidence capture-pr`, `evidence capture-evidence`, and other
# subcommands of the RiddimSoftware/evidence Swift package.
# See https://github.com/RiddimSoftware/evidence for full documentation.

scheme = "epac"
bundle_id = "net.dinglebox.cabinetdoor"

# iPhone 17 Pro Max — primary regression target. The org default per
# /Users/sunny/code memory; matches the layout used for App Store screenshots.
# Override locally with `evidence ... --simulator-udid <UDID>` if needed.
simulator_udid = "1B4F22DF-E851-4A3B-AFFE-0EA338BD5D48"

# Project lives one directory below the repo root.
xcode_project = "ios/epac.xcodeproj"

# Where capture commands write artifacts. Per-PR runs nest under
# docs/build-evidence/pr-<N>/. The directory is committed by convention
# for demonstration artifacts; CI workflow runs upload as workflow artifacts
# and only the report.md summary is posted to the PR comment.
evidence_dir = "docs/build-evidence"

# App Store screenshot device matrix — used only by `capture-screenshots`.
# Listed here so future App Store runs reuse the same simulator selection.
screenshot_targets = ["6.9"]
device_matrix = ["iPhone 17 Pro Max"]

# xcresult bundles are produced by `capture-evidence` only, not capture-pr.
# Set to false to ship only the markdown summary and stash the full
# bundle under ~/.evidence/cache/.
xcresult_enabled = true
xcresult_keep_full_bundle = false
