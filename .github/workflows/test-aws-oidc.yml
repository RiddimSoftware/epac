name: Test AWS OIDC role assumption

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    name: Verify OIDC role assumption and secret access
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch appstore/connect-api secret
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id appstore/connect-api \
            --region us-east-1 \
            --query SecretString \
            --output text)
          # Verify expected keys are present without printing values
          echo "$SECRET" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert 'key_id' in d, 'missing key_id'
          assert 'issuer_id' in d, 'missing issuer_id'
          assert 'private_key' in d, 'missing private_key'
          print('key_id:', d['key_id'])
          print('issuer_id:', d['issuer_id'])
          print('private_key: [present, not shown]')
          print('All expected keys found — OIDC role and secret access confirmed.')
          "
