# Enable auto-merge (squash) on every newly opened PR.
#
# Self-contained inlined version. The same file is replicated across all
# active RiddimSoftware repos so each repo enables auto-merge independently
# without depending on a cross-repo reusable workflow_call.
#
# Required org secrets (visibility=all):
#   DEV_BOT_APP_ID
#   DEV_BOT_PRIVATE_KEY

name: Set Auto-Merge

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  set-automerge:
    name: Set auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Generate developer-bot token
        id: dev-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DEV_BOT_APP_ID }}
          private-key: ${{ secrets.DEV_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # Retry loop: GitHub returns "unstable status" if required checks haven't
          # registered yet when the PR is first opened. Retrying after a short sleep
          # reliably closes that race condition.
          for attempt in 1 2 3 4 5; do
            already="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [[ "$already" == "true" ]]; then
              echo "Auto-merge already enabled for ${PR_URL}."
              exit 0
            fi
            echo "Enabling auto-merge for ${PR_URL} (attempt ${attempt}/5)."
            if gh pr merge --auto --squash "$PR_URL"; then
              echo "Auto-merge enabled."
              exit 0
            fi
            if [[ "${attempt}" -lt 5 ]]; then
              echo "Attempt ${attempt} failed, retrying in 15s..."
              sleep 15
            fi
          done
          echo "Failed to enable auto-merge after 5 attempts."
          exit 1
