name: Debug
on:
  push:
    branches: [main]
  pull_request:
jobs:
  debug:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: epac
          POSTGRES_PASSWORD: epac
          POSTGRES_DB: epac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.work
      - name: Run debug
        env:
          DATABASE_URL: postgresql://epac:epac@localhost:5432/epac_test?sslmode=disable
        run: |
          cd backend/search
          cat << 'GOEOF' > debug_test.go
          package main
          import (
            "context"
            "fmt"
            "testing"
            "github.com/jackc/pgx/v5"
            "os"
          )
          func TestDebug(t *testing.T) {
            conn, _ := pgx.Connect(context.Background(), os.Getenv("DATABASE_URL"))
            _, err := conn.Exec(context.Background(), "SELECT ts_headline('english', 'hello', plainto_tsquery('hello'), 'MaxWords=50, MinWords=10')")
            fmt.Printf("Error: %v\n", err)
            t.Fail()
          }
          GOEOF
          go test -v debug_test.go
