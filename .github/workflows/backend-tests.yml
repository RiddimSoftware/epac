name: Backend Go tests

on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda: [daily-fetch, loader, search, member-speeches, on-this-day, riding-boundary, toronto-council, openapi, live-status]
    name: Test ${{ matrix.lambda }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/${{ matrix.lambda }}/go.mod
      - name: Run tests with coverage
        working-directory: backend/${{ matrix.lambda }}
        run: go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out
