name: PR Build

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect iOS changes
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != 'pull_request' ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE_REF" --depth=1
          if git diff --name-only FETCH_HEAD..HEAD | grep -qE '^ios/|^\.swiftlint\.yml$'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: SwiftLint
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ["self-hosted","macOS"]
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint
        run: swiftlint --strict --reporter github-actions-logging

  localization:
    name: Localization Audit
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ["self-hosted","macOS"]
    steps:
      - uses: actions/checkout@v4
      - name: Audit localization coverage
        run: python3 scripts/localization/check_localizations.py --github-warnings

  build:
    name: iOS Build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ["self-hosted","macOS"]
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for package resolution
        run: |
          cat > "$RUNNER_TEMP/ci-gitconfig" <<'EOF'
          [url "https://github.com/"]
            insteadOf = git@github.com:
            insteadOf = ssh://git@github.com/
            insteadOf = git://github.com/
          EOF
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/ci-gitconfig" >> "$GITHUB_ENV"

      - name: Build
        working-directory: ios
        run: |
          xcodebuild build \
            -project epac.xcodeproj \
            -scheme epac \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/.deriveddata" \
            -jobs "$(sysctl -n hw.logicalcpu)" \
            CODE_SIGNING_ALLOWED=NO \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            ENABLE_TESTABILITY=NO

  pr-build:
    name: pr-build
    needs: [lint, localization, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check required PR gates passed
        env:
          LINT: ${{ needs.lint.result }}
          LOC: ${{ needs.localization.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          if [ "$LINT" != 'success' ] && [ "$LINT" != 'skipped' ]; then
            echo "SwiftLint failed (result: $LINT)"
            exit 1
          fi
          if [ "$LOC" != 'success' ] && [ "$LOC" != 'skipped' ]; then
            echo "Localization audit failed (result: $LOC)"
            exit 1
          fi
          if [ "$BUILD" != 'success' ] && [ "$BUILD" != 'skipped' ]; then
            echo "iOS build failed (result: $BUILD)"
            exit 1
          fi
