name: PR Build

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint
        run: swiftlint --reporter github-actions-logging

  localization:
    name: Localization Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit localization coverage
        run: python3 scripts/localization/check_localizations.py --github-warnings

  build:
    name: iOS Build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for package resolution
        run: |
          cat > "$RUNNER_TEMP/ci-gitconfig" <<'EOF'
          [url "https://github.com/"]
            insteadOf = git@github.com:
            insteadOf = ssh://git@github.com/
            insteadOf = git://github.com/
          EOF
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/ci-gitconfig" >> "$GITHUB_ENV"

      - name: Build
        working-directory: ios
        timeout-minutes: 40
        run: |
          package_cache="$RUNNER_TEMP/xcode-package-cache"
          cloned_packages="$RUNNER_TEMP/xcode-cloned-source-packages"
          rm -rf "$package_cache" "$cloned_packages"
          mkdir -p "$package_cache" "$cloned_packages"
          build_jobs="$(sysctl -n hw.logicalcpu)"
          if [ "$build_jobs" -gt 6 ]; then
            build_jobs=6
          fi
          echo "Using $build_jobs xcodebuild jobs"
          heartbeat() {
            while true; do
              sleep 60
              echo "xcodebuild still running at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            done
          }
          heartbeat &
          heartbeat_pid=$!
          cleanup_heartbeat() {
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
          }
          trap cleanup_heartbeat EXIT
          xcodebuild build \
            -project epac.xcodeproj \
            -scheme epac \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/.deriveddata" \
            -clonedSourcePackagesDirPath "$cloned_packages" \
            -packageCachePath "$package_cache" \
            -disablePackageRepositoryCache \
            -jobs "$build_jobs" \
            CODE_SIGNING_ALLOWED=NO \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            ENABLE_TESTABILITY=NO

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.work
          cache-dependency-path: backend/go.work.sum
      - name: Run lobbying-index tests
        working-directory: backend/lobbying-index
        run: go test ./...
      - name: Run bills-indexer tests
        working-directory: backend/bills-indexer
        run: go test ./...
      - name: Run members-indexer tests
        working-directory: backend/members-indexer
        run: go test ./...
      - name: Run push-notification-dispatcher tests
        working-directory: backend/push-notification-dispatcher
        run: go test ./...

  python-ci-tests:
    name: Python CI Tooling Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run scripts/ci tests
        run: python3 -m pytest scripts/ci/tests scripts/ci/test_backend_staging_smoke.py scripts/ci/test_ios_coverage_report.py

  pr-build:
    name: pr-build
    needs: [lint, localization, build, backend-tests, python-ci-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check required PR gates passed
        env:
          LINT: ${{ needs.lint.result }}
          LOC: ${{ needs.localization.result }}
          BUILD: ${{ needs.build.result }}
          BACKEND: ${{ needs.backend-tests.result }}
          PYTHON_CI: ${{ needs.python-ci-tests.result }}
        run: |
          if [ "$LINT" != 'success' ]; then
            echo "SwiftLint failed (result: $LINT)"
            exit 1
          fi
          if [ "$LOC" != 'success' ]; then
            echo "Localization audit failed (result: $LOC)"
            exit 1
          fi
          if [ "$BUILD" != 'success' ]; then
            echo "iOS build failed (result: $BUILD)"
            exit 1
          fi
          if [ "$BACKEND" != 'success' ]; then
            echo "Backend tests failed (result: $BACKEND)"
            exit 1
          fi
          if [ "$PYTHON_CI" != 'success' ]; then
            echo "Python CI tooling tests failed (result: $PYTHON_CI)"
            exit 1
          fi
