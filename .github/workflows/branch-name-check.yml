name: branch-name-check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# Why this workflow: GitHub repository rulesets' branch_name_pattern rule
# is currently rejected by the REST API (HTTP 422 'Invalid rule') for this
# repo, and we keep CI on Linux-only runners (see CLAUDE.md / Memory: CI
# cost decision). Running a 5-second Linux job on every PR open/sync is
# the cheapest enforcement we have. EPAC-332.

jobs:
  check-branch-name:
    runs-on: ["self-hosted","macOS"]
    steps:
      - name: Validate head branch name matches convention
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          pattern='^(feature|fix|perf|refactor)/EPAC-[0-9]+-.+$'
          if [[ "$HEAD_REF" =~ $pattern ]]; then
            echo "Branch '$HEAD_REF' matches $pattern."
          else
            echo "::error::Branch '$HEAD_REF' does not match required pattern $pattern"
            echo "::error::Use one of: feature/EPAC-NNN-slug, fix/EPAC-NNN-slug, perf/EPAC-NNN-slug, refactor/EPAC-NNN-slug"
            exit 1
          fi
