name: Internal Staging TestFlight Build

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip signing, archive, and TestFlight upload
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: internal-staging-testflight-build
  cancel-in-progress: false

env:
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  SKIP_WAITING_FOR_BUILD_PROCESSING: "false"
  STAGING_BACKEND_BASE_URL: ${{ vars.STAGING_BACKEND_BASE_URL || 'https://staging-api.epac.riddimsoftware.com' }}
  TESTFLIGHT_CHANGELOG: "Internal staging QA only. This build points at the staging backend and must not be treated as a production release candidate."

jobs:
  build-upload:
    name: Archive and upload internal staging TestFlight build
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_MAC || '["macos-15"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        if: ${{ !inputs.dry_run && !contains(fromJSON(vars.RUNNER_LABELS_MAC || '["macos-15"]'), 'self-hosted') }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby and Bundler
        if: ${{ !inputs.dry_run && !contains(fromJSON(vars.RUNNER_LABELS_MAC || '["macos-15"]'), 'self-hosted') }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ${{ vars.IOS_WORKDIR || 'ios' }}

      - name: Install Ruby bundle
        if: ${{ !inputs.dry_run && contains(fromJSON(vars.RUNNER_LABELS_MAC || '["macos-15"]'), 'self-hosted') }}
        working-directory: ${{ vars.IOS_WORKDIR || 'ios' }}
        run: |
          export BUNDLE_VERSION=system
          echo "BUNDLE_VERSION=system" >> "$GITHUB_ENV"
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Write App Store Connect credentials
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${ASC_KEY_ID:?ASC_KEY_ID secret is required}"
          : "${ASC_ISSUER_ID:?ASC_ISSUER_ID secret is required}"
          : "${ASC_PRIVATE_KEY:?ASC_PRIVATE_KEY secret is required}"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          p8_path="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$p8_path"
          chmod 600 "$p8_path"

          jq -n \
            --arg key_id "$ASC_KEY_ID" \
            --arg issuer_id "$ASC_ISSUER_ID" \
            --arg key "$ASC_PRIVATE_KEY" \
            '{
              key_id: $key_id,
              issuer_id: $issuer_id,
              key: $key,
              in_house: false
            }' > /tmp/asc_api_key.json
          chmod 600 /tmp/asc_api_key.json

          {
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
            echo "ASC_KEY_PATH=$p8_path"
          } >> "$GITHUB_ENV"

      - name: Install release helper dependencies
        if: ${{ !inputs.dry_run }}
        run: |
          python3 -m venv .venv-release
          .venv-release/bin/python -m pip install --upgrade pip --quiet
          .venv-release/bin/python -m pip install PyJWT requests cryptography --quiet

      - name: Compute internal staging TestFlight version train
        id: version
        if: ${{ !inputs.dry_run }}
        run: |
          .venv-release/bin/python scripts/release/compute_next_version.py \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --private-key-path "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            --app-id "${{ vars.APPLE_APP_ID }}" \
            --bump minor \
            --prefer-existing-train \
            --output-format github-output

      - name: Write distribution certificate
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          DISTRIBUTION_CERT_P12: ${{ secrets.DISTRIBUTION_CERT_P12 }}
          DISTRIBUTION_CERT_PASSWORD: ${{ secrets.DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DISTRIBUTION_CERT_P12:?DISTRIBUTION_CERT_P12 secret is required}"
          : "${DISTRIBUTION_CERT_PASSWORD:?DISTRIBUTION_CERT_PASSWORD secret is required}"

          printf '%s' "$DISTRIBUTION_CERT_P12" | base64 --decode > /tmp/dist_cert.p12
          chmod 600 /tmp/dist_cert.p12
          echo "DIST_CERT_PASSWORD=$DISTRIBUTION_CERT_PASSWORD" >> "$GITHUB_ENV"

      - name: Create ephemeral keychain
        if: ${{ !inputs.dry_run }}
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: scripts/runner/ephemeral_keychain.sh create

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Internal staging TestFlight dry run"
            echo ""
            echo "- Upload skipped: signing, archive, TestFlight upload, dSYM upload, and keychain setup were not run."
            echo "- Intended backend: $STAGING_BACKEND_BASE_URL"
            echo "- Intended metadata: $TESTFLIGHT_CHANGELOG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and upload internal staging build to TestFlight
        id: build-number
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ vars.IOS_WORKDIR || 'ios' }}
        env:
          NEW_VERSION: ${{ steps.version.outputs.next_version }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          BACKEND_BASE_URL: ${{ env.STAGING_BACKEND_BASE_URL }}
        run: |
          set +e
          output="$(bundle exec fastlane deploy \
            scheme:${{ vars.SCHEME }} \
            bundle_id:${{ vars.BUNDLE_ID }} \
            team_id:${{ vars.TEAM_ID }} \
            xcodeproj:${{ vars.XCODEPROJ_PATH }} \
            extra_bundle_ids:"${{ vars.EXTRA_BUNDLE_IDS || '' }}" 2>&1)"
          exit_code=$?
          set -e
          echo "$output"
          if [ $exit_code -ne 0 ] && echo "$output" | grep -q "Upload limit reached"; then
            echo "::warning::Apple daily upload limit reached. Build was successful but upload was rejected. This is transient and resolves after 24 hours."
            echo "upload_limit_reached=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $exit_code

      # ------------------------------------------------------------------
      # Emit release-manifest.json for chain-of-custody receipt generation.
      #
      # Consumed by software-factory's chain-of-custody receipt generation;
      # do not remove without coordinating with FAC team.
      #
      # Produces a deterministic build_number ↔ git_sha ↔ pr_numbers mapping
      # that the factory receipt generator reads to populate
      # release.built_from_sha. See EPAC-1929.
      # ------------------------------------------------------------------
      - name: Clear runner AWS profile selectors
        if: ${{ !inputs.dry_run && steps.build-number.outputs.upload_limit_reached != 'true' }}
        run: |
          echo "AWS_PROFILE=" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_PROFILE=" >> "$GITHUB_ENV"

      - name: Configure AWS credentials via OIDC
        if: ${{ !inputs.dry_run && steps.build-number.outputs.upload_limit_reached != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
          unset-current-credentials: true

      - name: Emit release manifest
        if: ${{ !inputs.dry_run && steps.build-number.outputs.upload_limit_reached != 'true' }}
        env:
          BUILD_NUMBER: ${{ steps.build-number.outputs.build_number }}
          GIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          S3_BUCKET_PREFIX: s3://riddimsoftware-factory-transcripts/release-manifests
        run: scripts/ci/emit_release_manifest.sh

      - name: Delete ephemeral keychain
        if: ${{ always() && !inputs.dry_run }}
        run: scripts/runner/ephemeral_keychain.sh cleanup

      - name: Summary
        if: ${{ !inputs.dry_run }}
        run: |
          {
            if [ "${{ steps.build-number.outputs.upload_limit_reached }}" = "true" ]; then
              echo "## Internal staging TestFlight upload skipped - daily limit reached"
              echo ""
              echo "Apple's daily upload limit was hit. The internal staging build compiled successfully, but App Store Connect rejected the upload with HTTP 409."
              echo "This is transient and self-resolves after 24 hours. No action required."
              echo ""
              echo "- Workflow source: ${{ github.event_name }}"
              echo "- Commit: ${{ github.sha }}"
              echo "- Version: ${{ steps.version.outputs.next_version }}"
              echo "- Version source: ${{ steps.version.outputs.version_source }}"
              echo "- Build attempted: #${{ steps.build-number.outputs.build_number }}"
              echo "- Backend: $STAGING_BACKEND_BASE_URL"
            else
              echo "## Internal staging TestFlight build uploaded"
              echo ""
              echo "This build is for internal staging backend QA only. Do not treat it as a production release candidate."
              echo ""
              echo "- Workflow source: ${{ github.event_name }}"
              echo "- Commit: ${{ github.sha }}"
              echo "- Version: ${{ steps.version.outputs.next_version }}"
              echo "- Version source: ${{ steps.version.outputs.version_source }}"
              echo "- Build: #${{ steps.build-number.outputs.build_number }}"
              echo "- Backend: $STAGING_BACKEND_BASE_URL"
              echo "- TestFlight metadata: $TESTFLIGHT_CHANGELOG"
              echo "- TestFlight: https://appstoreconnect.apple.com/apps/${{ vars.APPLE_APP_ID }}/testflight/ios"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
