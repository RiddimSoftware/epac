# Enables GitHub auto-merge when the `automate` label is added to an epac PR.
# Shared implementation lives in RiddimSoftware/riddim-release.
name: Automate Auto-Merge

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  call:
    if: ${{ github.event.label.name == 'automate' }}
    uses: RiddimSoftware/riddim-release/.github/workflows/automate-auto-merge.yml@feature/RIDDIM-139-automate-auto-merge
    with:
      pr_number: ${{ github.event.pull_request.number }}
      repository: ${{ github.repository }}
    secrets:
      dev_bot_pat: ${{ secrets.DEV_BOT_PAT }}
