name: Infrastructure Validation

on:
  pull_request:
    paths:
      - 'backend/manifest/**'
      - 'infra/terraform/**'
      - '.github/workflows/infra-validate.yml'
  push:
    branches: [main]
    paths:
      - 'backend/manifest/**'
      - 'infra/terraform/**'
      - '.github/workflows/infra-validate.yml'

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.3"

      - name: Validate Core
        working-directory: infra/terraform/core
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Staging
        working-directory: infra/terraform/staging
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Production
        if: ${{ hashFiles('infra/terraform/production/*.tf') != '' }}
        working-directory: infra/terraform/production
        run: |
          terraform init -backend=false
          terraform validate

      - name: Skip Production Validate
        if: ${{ hashFiles('infra/terraform/production/*.tf') == '' }}
        run: echo "No production Terraform directory found; skipping production validation."

  infra-plan:
    name: infra-plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.3"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        id: init
        working-directory: infra/terraform/staging
        run: |
          set +e
          terraform init -input=false -no-color 2>&1
          status=$?
          set -e
          echo "exitcode=$status" >> "$GITHUB_OUTPUT"

      - name: Terraform plan
        id: plan
        if: ${{ steps.init.outputs.exitcode == '0' }}
        working-directory: infra/terraform/staging
        run: |
          set +e
          terraform plan -input=false -no-color -out=tfplan > tfplan.txt 2>&1
          status=$?
          set -e
          cat tfplan.txt
          echo "exitcode=$status" >> "$GITHUB_OUTPUT"

      - name: Upload staging Terraform plan
        if: ${{ steps.init.outputs.exitcode == '0' && steps.plan.outputs.exitcode == '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: epac-tfplan-staging-${{ github.sha }}
          path: infra/terraform/staging/tfplan
          if-no-files-found: error
          retention-days: 14

      - name: Fail if plan failed
        if: ${{ steps.init.outputs.exitcode == '0' && steps.plan.outputs.exitcode != '0' }}
        run: exit 1

      - name: Warn if init failed
        if: ${{ steps.init.outputs.exitcode != '0' }}
        run: echo "::warning::Terraform init failed — the S3 state backend may not be accessible. Run bootstrap.sh with admin credentials to provision the backend."
