name: swiftlint

on:
  push:
    branches: [main]
    paths:
      - 'ios/**/*.swift'
      - 'ios/epac/*.lproj/Localizable.strings'
      - 'scripts/localization/check_localizations.py'
      - '.swiftlint.yml'
  workflow_dispatch:

# Why this workflow: per the project CI cost decision (memory:
# feedback_ci_cost), GitHub Actions stays Linux-only. SwiftLint runs
# fine on Linux (`realm/SwiftLint`), so this is a sub-minute job per
# PR. Runs `--strict` so warnings also fail the build — see CLAUDE.md
# "SwiftLint baseline" for the rationale on which rules are disabled.
#
# Path filters keep the workflow off the queue for backend / docs PRs.

jobs:
  lint:
    runs-on: ["self-hosted","macOS"]
    container:
      image: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint
        run: swiftlint --strict --reporter github-actions-logging

  localization:
    runs-on: ["self-hosted","macOS"]
    steps:
      - uses: actions/checkout@v4
      - name: Audit localization coverage
        run: python3 scripts/localization/check_localizations.py --github-warnings
