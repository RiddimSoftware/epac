name: Submit App Store Review

# Keep this in sync with the shared release workflow in riddim-release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit
        required: true
        type: string
      dry_run:
        description: Exercise the release workflow without submitting to App Review
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  call:
    uses: RiddimSoftware/riddim-release/.github/workflows/release-app-store.yml@main
    with:
      apple_app_id:        ${{ vars.APPLE_APP_ID }}
      bundle_id:           ${{ vars.BUNDLE_ID }}
      ios_workdir:         ${{ vars.IOS_WORKDIR || 'ios' }}
      primary_locale:      ${{ vars.PRIMARY_LOCALE || 'en-CA' }}
      tag:                 ${{ inputs.tag }}
      dry_run:             ${{ inputs.dry_run || false }}
      approval_environment: ${{ vars.APPROVAL_ENVIRONMENT || 'app-store-release' }}
      runner_labels_mac:    ${{ vars.RUNNER_LABELS_MAC || '["self-hosted","macOS"]' }}
      runner_labels_linux:  ${{ vars.RUNNER_LABELS_LINUX || '["self-hosted","macOS"]' }}
    secrets: inherit
