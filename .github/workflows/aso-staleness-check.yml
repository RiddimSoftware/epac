name: ASO Staleness Check

on:
  schedule:
    # Run daily at 08:00 UTC (04:00 ET) to catch sitting status changes as soon as they happen.
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-promotional-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check promotional text staleness
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          python3 scripts/marketing/check_promotional_text_staleness.py --create-linear-issue --fail-on-stale
