name: journeys-lint

on:
  pull_request:
    paths:
      - "docs/journeys/**"
      - "scripts/journeys/lint.py"
      - "requirements-dev.txt"

jobs:
  lint:
    name: Lint journey catalogue
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run journey lint
        run: python3 scripts/journeys/lint.py
