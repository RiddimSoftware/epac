name: Launch Performance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-performance:
    name: Launch performance
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for package resolution
        run: |
          cat > "$RUNNER_TEMP/ci-gitconfig" <<'EOF'
          [url "https://github.com/"]
            insteadOf = git@github.com:
            insteadOf = ssh://git@github.com/
            insteadOf = git://github.com/
          EOF
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/ci-gitconfig" >> "$GITHUB_ENV"

      - name: Resolve iOS 26 simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_env="$RUNNER_TEMP/launch-simulator.env"
          SIMULATOR_ENV="$simulator_env" python3 <<'PY'
          import json
          import os
          import re
          import shlex
          import subprocess
          import sys

          def version_tuple(value):
              return tuple(int(part) for part in re.findall(r"\d+", value))

          runtimes = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "--json"], text=True)
          ).get("runtimes", [])
          ios_26_runtimes = [
              runtime
              for runtime in runtimes
              if runtime.get("isAvailable", True)
              and (
                  runtime.get("platform") == "iOS"
                  or "iOS" in runtime.get("name", "")
                  or "com.apple.CoreSimulator.SimRuntime.iOS" in runtime.get("identifier", "")
              )
              and str(runtime.get("version", "")).startswith("26.")
          ]
          if not ios_26_runtimes:
              sys.exit("No available iOS 26.x Simulator runtime found.")

          runtime = max(ios_26_runtimes, key=lambda item: version_tuple(str(item.get("version", ""))))
          devices_by_runtime = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devices", "--json"], text=True)
          ).get("devices", {})
          devices = [
              device
              for device in devices_by_runtime.get(runtime["identifier"], [])
              if device.get("isAvailable", True)
          ]

          preferred = [device for device in devices if device.get("name") == "iPhone 17 Pro Max"]
          fallback = [
              device
              for device in devices
              if device.get("name", "").startswith("iPhone ")
              and (" Pro" in device.get("name", "") or "Pro Max" in device.get("name", ""))
          ]

          def device_score(device):
              name = device.get("name", "")
              generation = max([int(part) for part in re.findall(r"\d+", name)] or [0])
              tier = 2 if "Pro Max" in name else 1 if " Pro" in name else 0
              return (tier, generation, name)

          if preferred:
              device = preferred[0]
          elif fallback:
              device = max(fallback, key=device_score)
          else:
              sys.exit("No available iPhone Pro or Pro Max simulator found on the iOS 26.x runtime.")

          values = {
              "SIMULATOR_UDID": device["udid"],
              "SIMULATOR_NAME": device["name"],
              "SIMULATOR_RUNTIME": f'{runtime.get("name", "iOS")} {runtime.get("version", "")}'.strip(),
          }
          with open(os.environ["SIMULATOR_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={shlex.quote(value)}\n")
          for path in (os.environ["GITHUB_ENV"], os.environ["GITHUB_OUTPUT"]):
              with open(path, "a", encoding="utf-8") as handle:
                  for key, value in values.items():
                      handle.write(f"{key}={value}\n")
          PY
          # shellcheck source=/dev/null
          source "$simulator_env"
          echo "Resolved $SIMULATOR_NAME on $SIMULATOR_RUNTIME ($SIMULATOR_UDID)"

      - name: Run launch performance test
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          budget_file=".github/perf-budgets/launch-time-seconds.txt"
          budget="$(cat "$budget_file")"
          result_bundle="$RUNNER_TEMP/LaunchPerf.xcresult"
          log_file="$RUNNER_TEMP/launch-perf-xcodebuild.log"
          package_cache="$RUNNER_TEMP/xcode-package-cache"
          cloned_packages="$RUNNER_TEMP/xcode-cloned-source-packages"
          rm -rf "$result_bundle" "$package_cache" "$cloned_packages"
          mkdir -p "$package_cache" "$cloned_packages"

          set +e
          xcodebuild test \
            -project ios/epac.xcodeproj \
            -scheme epac \
            -configuration Release \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/.deriveddata-launch-perf" \
            -clonedSourcePackagesDirPath "$cloned_packages" \
            -packageCachePath "$package_cache" \
            -disablePackageRepositoryCache \
            -resultBundlePath "$result_bundle" \
            -only-testing:epacUITests/epacUITestsLaunchTests/testLaunchPerformance \
            ENABLE_TESTABILITY=YES \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$log_file"
          xcode_status="${PIPESTATUS[0]}"
          set -e

          # XCTest currently prints the launch metric as "average: 1.234"; fail loudly if that format changes.
          average="$(grep -oE "average: [0-9.]+" "$log_file" | tail -1 | awk '{print $2}' || true)"
          if [ -z "$average" ]; then
            result="failed: xcodebuild output did not include an average launch time"
            comparison_status=1
          else
            if python3 - "$average" "$budget" <<'PY'
          import sys

          measured = float(sys.argv[1])
          budget = float(sys.argv[2])
          sys.exit(1 if measured > budget else 0)
          PY
            then
              comparison_status=0
              result="passed"
            else
              comparison_status=1
              result="failed: measured average exceeded budget"
            fi
          fi

          {
            echo "## Launch performance"
            echo ""
            echo "| Metric | Seconds |"
            echo "| --- | ---: |"
            echo "| Budget | $budget |"
            echo "| Measured average | ${average:-not found} |"
            echo ""
            echo "| Environment | Value |"
            echo "| --- | --- |"
            echo "| Simulator | $SIMULATOR_NAME |"
            echo "| Runtime | $SIMULATOR_RUNTIME |"
            echo "| Result bundle | LaunchPerf.xcresult |"
            echo ""
            echo "**Result:** $result"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$xcode_status" -ne 0 ]; then
            exit "$xcode_status"
          fi
          exit "$comparison_status"

      - name: Upload launch performance result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-perf-xcresult-${{ github.run_number }}
          path: ${{ runner.temp }}/LaunchPerf.xcresult
          if-no-files-found: error
