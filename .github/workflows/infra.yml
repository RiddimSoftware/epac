# IAM infrastructure pipeline.
#
# Applies inline policies declared in infra/iam/<role>/<PolicyName>.json to
# their target roles on every push to main. Idempotent — put-role-policy is a
# no-op when the document is unchanged.
#
# Uses GitHubActions-epac-infra (not the deploy role) so that IAM management
# is isolated from the Lambda/API-Gateway deploy surface.

name: Infra

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  iam:
    name: Apply IAM policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::227530433709:role/GitHubActions-epac-infra
          aws-region: us-east-1

      - name: Apply inline policies from infra/iam/
        shell: bash
        run: |
          set -euo pipefail
          echo "## IAM policy sync" >> "$GITHUB_STEP_SUMMARY"
          echo "| Role | Policy | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          for policy_file in infra/iam/*/*.json; do
            role_name="$(basename "$(dirname "$policy_file")")"
            policy_name="$(basename "$policy_file" .json)"

            aws iam put-role-policy \
              --role-name "$role_name" \
              --policy-name "$policy_name" \
              --policy-document "file://$policy_file"

            echo "| $role_name | $policy_name | applied |" >> "$GITHUB_STEP_SUMMARY"
            echo "Applied $policy_name to $role_name"
          done
