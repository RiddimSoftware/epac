name: Refresh Artifact Manifest

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-artifacts
  cancel-in-progress: false

jobs:
  refresh-manifest:
    name: Refresh manifest.json
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Clear runner AWS profile overrides
        run: |
          echo "AWS_PROFILE=" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_PROFILE=" >> "$GITHUB_ENV"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARTIFACTS_PUBLISHER_ROLE_ARN }}
          aws-region: us-east-1
          unset-current-credentials: true

      - name: Validate manifest configuration
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          ARTIFACTS_DISTRIBUTION_ID: ${{ vars.ARTIFACTS_DISTRIBUTION_ID }}
        run: |
          missing=0
          if [ -z "$ARTIFACTS_BUCKET" ]; then
            echo "ARTIFACTS_BUCKET repository variable is required"
            missing=1
          fi
          if [ -z "$ARTIFACTS_DISTRIBUTION_ID" ]; then
            echo "ARTIFACTS_DISTRIBUTION_ID repository variable is required"
            missing=1
          fi
          exit "$missing"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install statistics publisher dependencies
        run: python3 -m pip install -r backend/statistics-requirements.txt

      - name: Prepare artifact staging
        run: mkdir -p ./build/artifacts

      - name: Preserve existing statistics artifacts
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          aws s3 sync "s3://${ARTIFACTS_BUCKET}/statistics" ./build/artifacts/statistics --only-show-errors

      - name: Build health check artifact
        id: healthz
        continue-on-error: true
        run: |
          mkdir -p ./build/artifacts/healthz/v1
          printf 'ok\n' > ./build/artifacts/healthz/v1/healthz.txt

      - name: Build Hansard subjects artifact
        working-directory: backend/hansard-subjects-index
        env:
          DATABASE_URL_SECRET_ID: epac/database-url
        run: |
          set -euo pipefail
          secret=$(aws secretsmanager get-secret-value --secret-id "$DATABASE_URL_SECRET_ID" --query SecretString --output text)
          if printf '%s' "$secret" | jq -e 'type == "object" and has("DATABASE_URL")' >/dev/null 2>&1; then
            database_url=$(printf '%s' "$secret" | jq -r '.DATABASE_URL')
          else
            database_url=$secret
          fi
          if [ -z "$database_url" ] || [ "$database_url" = "null" ]; then
            echo "Secret ${DATABASE_URL_SECRET_ID} did not contain a DATABASE_URL value"
            exit 1
          fi
          DATABASE_URL="$database_url" go run . --output-dir ../../build/artifacts
          find ../../build/artifacts -type f -name '*.metadata.json' -delete

      - name: Build hot parliamentary artifacts
        working-directory: backend
        env:
          DATABASE_URL_SECRET_ID: epac/database-url
        run: |
          set -euo pipefail
          secret=$(aws secretsmanager get-secret-value --secret-id "$DATABASE_URL_SECRET_ID" --query SecretString --output text)
          if printf '%s' "$secret" | jq -e 'type == "object" and has("DATABASE_URL")' >/dev/null 2>&1; then
            database_url=$(printf '%s' "$secret" | jq -r '.DATABASE_URL')
          else
            database_url=$secret
          fi
          if [ -z "$database_url" ] || [ "$database_url" = "null" ]; then
            echo "Secret ${DATABASE_URL_SECRET_ID} did not contain a DATABASE_URL value"
            exit 1
          fi

          DATABASE_URL="$database_url" go run ./members-publisher --output ../build/artifacts/members
          DATABASE_URL="$database_url" go run ./sittings-publisher --output ../build/artifacts/sittings
          DATABASE_URL="$database_url" go run ./on-this-day/cmd/publisher --output ../build/artifacts/on-this-day
          DATABASE_URL="$database_url" go run ./estimates/cmd/publisher --output ../build/artifacts/estimates
          go run ./bills-publisher --output ../build/artifacts/bills
          go run ./riding-boundary/cmd/publisher --output ../build/artifacts/ridings
          go run ./live-status/cmd/calendar-publisher --output ../build/artifacts/calendar
          go run ./config/cmd/publisher --output ../build/artifacts/config

      - name: Build member speech artifacts
        working-directory: backend/member-speeches-publisher
        env:
          DATABASE_URL_SECRET_ID: epac/database-url
          ARTIFACTS_DIR: ../../build/artifacts
        run: |
          set -euo pipefail
          secret=$(aws secretsmanager get-secret-value --secret-id "$DATABASE_URL_SECRET_ID" --query SecretString --output text)
          if printf '%s' "$secret" | jq -e 'type == "object" and has("DATABASE_URL")' >/dev/null 2>&1; then
            database_url=$(printf '%s' "$secret" | jq -r '.DATABASE_URL')
          else
            database_url=$secret
          fi
          if [ -z "$database_url" ] || [ "$database_url" = "null" ]; then
            echo "Secret ${DATABASE_URL_SECRET_ID} did not contain a DATABASE_URL value"
            exit 1
          fi
          DATABASE_URL="$database_url" go run .

      - name: Build member vote artifacts
        working-directory: backend/member-votes-publisher
        env:
          DATABASE_URL_SECRET_ID: epac/database-url
          ARTIFACTS_DIR: ../../build/artifacts
        run: |
          set -euo pipefail
          secret=$(aws secretsmanager get-secret-value --secret-id "$DATABASE_URL_SECRET_ID" --query SecretString --output text)
          if printf '%s' "$secret" | jq -e 'type == "object" and has("DATABASE_URL")' >/dev/null 2>&1; then
            database_url=$(printf '%s' "$secret" | jq -r '.DATABASE_URL')
          else
            database_url=$secret
          fi
          if [ -z "$database_url" ] || [ "$database_url" = "null" ]; then
            echo "Secret ${DATABASE_URL_SECRET_ID} did not contain a DATABASE_URL value"
            exit 1
          fi
          DATABASE_URL="$database_url" go run .

      - name: Verify publishable artifacts
        id: publishable
        if: always()
        env:
          HEALTHZ_OUTCOME: ${{ steps.healthz.outcome }}
        run: |
          set -euo pipefail
          if [ "$HEALTHZ_OUTCOME" != 'success' ]; then
            echo "No artifact pipelines succeeded"
            exit 1
          fi
          if ! find ./build/artifacts -type f -print -quit | grep -q .; then
            echo "No artifact files were staged"
            exit 1
          fi
          test -s ./build/artifacts/members/v1/all.json
          test -s ./build/artifacts/sittings/v1/all.json
          test -s ./build/artifacts/bills/v1/all.json
          test -s ./build/artifacts/on-this-day/v1/all.json
          test -s ./build/artifacts/estimates/v1/all.json
          test -s ./build/artifacts/calendar/v1/house.ics
          test -s ./build/artifacts/config/v1/app.json
          test -s ./build/artifacts/ridings/v1/index.json
          find ./build/artifacts/estimates/v1/by-org -name '*.json' -print -quit | grep -q .
          find ./build/artifacts/ridings/v1/boundary -name '*.json' -print -quit | grep -q .
          find ./build/artifacts/members/v1/by-id -path '*/speeches*.json' -type f -print -quit | grep -q .
          find ./build/artifacts/members/v1/by-id -path '*/votes*.json' -type f -print -quit | grep -q .

          if [ -d ./build/artifacts/sittings/v1/by-date ]; then
            find ./build/artifacts/sittings/v1/by-date -name '*.json' -print0 | while IFS= read -r -d '' file; do
              size=$(gzip -c "$file" | wc -c | tr -d ' ')
              if [ "$size" -gt 5242880 ]; then
                echo "$file exceeds 5 MiB gzipped (${size} bytes)"
                exit 1
              fi
            done
          fi

          find ./build/artifacts/members/v1/by-id \( -path '*/speeches*.json' -o -path '*/votes*.json' \) -type f -print0 | while IFS= read -r -d '' file; do
            size=$(gzip -c "$file" | wc -c | tr -d ' ')
            if [ "$size" -gt 5242880 ]; then
              echo "$file exceeds 5 MiB gzipped (${size} bytes)"
              exit 1
            fi
          done

          find ./build/artifacts/ridings/v1/boundary -name '*.json' -type f -print0 | while IFS= read -r -d '' file; do
            size=$(gzip -c "$file" | wc -c | tr -d ' ')
            if [ "$size" -gt 5242880 ]; then
              echo "$file exceeds 5 MiB gzipped (${size} bytes)"
              exit 1
            fi
          done

      - name: Sync artifacts to S3
        run: |
          aws s3 sync ./build/artifacts "s3://${{ vars.ARTIFACTS_BUCKET }}/" --delete --cache-control "public,max-age=31536000,immutable"

      - name: Attach artifact content hashes
        run: |
          while IFS= read -r -d '' file; do
            key="${file#./build/artifacts/}"
            content_hash="$(sha256sum "$file" | cut -d ' ' -f1)"
            aws s3 cp "$file" "s3://${{ vars.ARTIFACTS_BUCKET }}/${key}" --cache-control "public,max-age=31536000,immutable" --metadata "content-hash-sha256=${content_hash}"
          done < <(find ./build/artifacts -type f -print0)

      - name: Publish CPI statistics artifact
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          if python3 scripts/artifacts/should_publish_statistics.py monthly; then
            python3 backend/cpi-statistics/cpi_statistics.py --s3-publish --s3-bucket "$ARTIFACTS_BUCKET"
          else
            echo "Skipping CPI statistics; monthly cadence publishes on day 22 at 00:00 UTC."
          fi

      - name: Publish Fiscal Monitor statistics artifact
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          if python3 scripts/artifacts/should_publish_statistics.py monthly; then
            python3 backend/fiscal-monitor/fiscal_monitor.py --s3-publish --s3-bucket "$ARTIFACTS_BUCKET"
          else
            echo "Skipping Fiscal Monitor statistics; monthly cadence publishes on day 22 at 00:00 UTC."
          fi

      - name: Publish CPP/OAS statistics artifact
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          if python3 scripts/artifacts/should_publish_statistics.py quarterly; then
            python3 backend/cpp-oas-statistics/cpp_oas_statistics.py --s3-publish --s3-bucket "$ARTIFACTS_BUCKET"
          else
            echo "Skipping CPP/OAS statistics; quarterly cadence publishes Jan/Apr/Jul/Oct day 22 at 00:00 UTC."
          fi

      - name: Publish EI statistics artifact
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          if python3 scripts/artifacts/should_publish_statistics.py quarterly; then
            python3 backend/ei-statistics/ei_statistics.py --s3-publish --s3-bucket "$ARTIFACTS_BUCKET"
          else
            echo "Skipping EI statistics; quarterly cadence publishes Jan/Apr/Jul/Oct day 22 at 00:00 UTC."
          fi

      - name: Publish VAC statistics artifact
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          if python3 scripts/artifacts/should_publish_statistics.py quarterly; then
            python3 backend/vac-statistics/vac_statistics.py --s3-publish --s3-bucket "$ARTIFACTS_BUCKET"
          else
            echo "Skipping VAC statistics; quarterly cadence publishes Jan/Apr/Jul/Oct day 22 at 00:00 UTC."
          fi

      - name: Publish student finance statistics artifact
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          if python3 scripts/artifacts/should_publish_statistics.py quarterly; then
            python3 backend/student-finance-statistics/student_finance_statistics.py --s3-publish --s3-bucket "$ARTIFACTS_BUCKET"
          else
            echo "Skipping student finance statistics; quarterly cadence publishes Jan/Apr/Jul/Oct day 22 at 00:00 UTC."
          fi

      - name: Publish corrections statistics artifact
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          if python3 scripts/artifacts/should_publish_statistics.py quarterly; then
            python3 backend/corrections-statistics/corrections_statistics.py --s3-publish --s3-bucket "$ARTIFACTS_BUCKET"
          else
            echo "Skipping corrections statistics; quarterly cadence publishes Jan/Apr/Jul/Oct day 22 at 00:00 UTC."
          fi

      - name: Publish transport safety statistics artifact
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          if python3 scripts/artifacts/should_publish_statistics.py quarterly; then
            python3 backend/transport-safety-statistics/transport_safety_statistics.py --s3-publish --s3-bucket "$ARTIFACTS_BUCKET"
          else
            echo "Skipping transport safety statistics; quarterly cadence publishes Jan/Apr/Jul/Oct day 22 at 00:00 UTC."
          fi

      - name: Generate and publish manifest
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          GOWORK: ${{ github.workspace }}/backend/go.work
        run: |
          go run ./backend/manifest/cmd/generate-manifest

      - name: Invalidate manifest
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ vars.ARTIFACTS_DISTRIBUTION_ID }}" --paths "/manifest.json"
