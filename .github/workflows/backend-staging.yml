name: Backend Staging Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-staging.yml'
      - 'scripts/ci/backend_staging_smoke.py'
  workflow_dispatch:

concurrency:
  group: backend-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ matrix.service }} to staging
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [daily-fetch, loader, search, member-speeches, on-this-day, riding-boundary, health, device-register, openapi, live-status]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/${{ matrix.service }}/go.mod

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Test and package Lambda
        working-directory: backend
        run: make test package SERVICE=${{ matrix.service }}

      - name: Update staging Lambda
        working-directory: backend/${{ matrix.service }}
        env:
          FUNCTION_NAME: epac-${{ matrix.service }}-staging
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://function.zip
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

      - name: Sync staging DATABASE_URL from Secrets Manager
        if: ${{ contains(fromJSON('["search","member-speeches","on-this-day","health","device-register","live-status"]'), matrix.service) }}
        env:
          FUNCTION_NAME: epac-${{ matrix.service }}-staging
          DATABASE_URL_SECRET_ID: epac/database-url
        run: |
          set -euo pipefail

          DATABASE_URL=$(aws secretsmanager get-secret-value \
            --secret-id "$DATABASE_URL_SECRET_ID" \
            --query SecretString \
            --output text)
          if printf '%s' "$DATABASE_URL" | jq -e 'type == "object" and has("DATABASE_URL")' >/dev/null 2>&1; then
            DATABASE_URL=$(printf '%s' "$DATABASE_URL" | jq -r '.DATABASE_URL')
          fi
          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "None" ]; then
            echo "Secret ${DATABASE_URL_SECRET_ID} did not contain a DATABASE_URL value"
            exit 1
          fi

          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json)
          UPDATED_ENV=$(jq -cn \
            --argjson current "${CURRENT_ENV:-null}" \
            --arg database_url "$DATABASE_URL" \
            '{Variables: (($current // {}) + {DATABASE_URL: $database_url})}')

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "$UPDATED_ENV" \
            >/dev/null
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

  smoke:
    name: Smoke test staging backend
    runs-on: ubuntu-latest
    needs: deploy
    env:
      STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL || 'https://staging-api.epac.riddimsoftware.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Ensure staging routes are synced
        env:
          ENV_NAME: staging
          STAGE_NAME: staging
        run: ./scripts/ci/ensure-staging-api-routes.sh

      - name: Run staging backend smoke tests
        run: python3 scripts/ci/backend_staging_smoke.py --base-url "$STAGING_API_BASE_URL"
