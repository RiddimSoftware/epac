name: Backend Staging Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-staging.yml'
      - 'scripts/ci/backend_staging_smoke.py'
      - 'backend/manifest/deployment-services.json'
  workflow_dispatch:

concurrency:
  group: backend-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Resolve backend service manifest
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.resolve.outputs.services }}
      database_services: ${{ steps.resolve.outputs.database_services }}
      artifact_services: ${{ steps.resolve.outputs.artifact_services }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          SERVICES=$(jq -c '[.services[] | select(.deploy.staging == true) | .name]' backend/manifest/deployment-services.json)
          DATABASE_SERVICES=$(jq -c '[.services[] | select(.sync.staging.database == true) | .name]' backend/manifest/deployment-services.json)
          ARTIFACT_SERVICES=$(jq -c '[.services[] | select(.sync.staging.artifact == true) | .name]' backend/manifest/deployment-services.json)

          if [ "$SERVICES" = "[]" ]; then
            echo "No staging services found in manifest" >&2
            exit 1
          fi

          {
            echo "services=$SERVICES"
            echo "database_services=$DATABASE_SERVICES"
            echo "artifact_services=$ARTIFACT_SERVICES"
          } >> "$GITHUB_OUTPUT"

  provision-search:
    name: Provision staging search Lambdas and API route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Provision search Lambdas and API Gateway route
        env:
          LAMBDA_ROLE: arn:aws:iam::227530433709:role/epac-lambda-role
          API_ID: f4x35gduxl
          ACCOUNT_ID: '227530433709'
        run: |
          set -euo pipefail

          {
            echo "## Provision staging search resources"
            echo ""
            echo "| Resource | Outcome |"
            echo "|----------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"

          # --- epac-hansard-search-index-staging Lambda ---
          if ! aws lambda get-function --function-name epac-hansard-search-index-staging > /dev/null 2>&1; then
            aws lambda create-function \
              --function-name epac-hansard-search-index-staging \
              --runtime provided.al2023 \
              --handler bootstrap \
              --architectures arm64 \
              --role "$LAMBDA_ROLE" \
              --zip-file fileb://infra/terraform/staging/placeholder.zip \
              --timeout 60 \
              --memory-size 128
            aws lambda wait function-active-v2 --function-name epac-hansard-search-index-staging
            echo "| epac-hansard-search-index-staging | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| epac-hansard-search-index-staging | already existed, skipped |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- epac-hansard-search-staging Lambda ---
          if ! aws lambda get-function --function-name epac-hansard-search-staging > /dev/null 2>&1; then
            aws lambda create-function \
              --function-name epac-hansard-search-staging \
              --runtime provided.al2023 \
              --handler bootstrap \
              --architectures arm64 \
              --role "$LAMBDA_ROLE" \
              --zip-file fileb://infra/terraform/staging/placeholder.zip \
              --timeout 60 \
              --memory-size 128
            aws lambda wait function-active-v2 --function-name epac-hansard-search-staging
            echo "| epac-hansard-search-staging | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| epac-hansard-search-staging | already existed, skipped |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- API Gateway integration for hansard-search ---
          EXISTING_INTEGRATION_ID=$(aws apigatewayv2 get-integrations --api-id "$API_ID" \
            --query "Items[?IntegrationUri=='arn:aws:lambda:us-east-1:${ACCOUNT_ID}:function:epac-hansard-search-staging'].IntegrationId | [0]" \
            --output text)

          if [ "$EXISTING_INTEGRATION_ID" = "None" ] || [ -z "$EXISTING_INTEGRATION_ID" ]; then
            INTEGRATION_ID=$(aws apigatewayv2 create-integration \
              --api-id "$API_ID" \
              --integration-type AWS_PROXY \
              --integration-uri "arn:aws:lambda:us-east-1:${ACCOUNT_ID}:function:epac-hansard-search-staging" \
              --payload-format-version 2.0 \
              --query IntegrationId --output text)
            echo "| API Gateway integration | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            INTEGRATION_ID="$EXISTING_INTEGRATION_ID"
            echo "| API Gateway integration | already existed, skipped |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- API Gateway route ---
          ROUTE_ID=$(aws apigatewayv2 get-routes --api-id "$API_ID" \
            --query "Items[?RouteKey=='GET /api/v1/hansard/search'].RouteId | [0]" \
            --output text)

          if [ "$ROUTE_ID" = "None" ] || [ -z "$ROUTE_ID" ]; then
            aws apigatewayv2 create-route \
              --api-id "$API_ID" \
              --route-key "GET /api/v1/hansard/search" \
              --target "integrations/${INTEGRATION_ID}"
            echo "| GET /api/v1/hansard/search route | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| GET /api/v1/hansard/search route | already existed, skipped |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- Lambda permission (add-permission is not idempotent; suppress duplicate error) ---
          aws lambda add-permission \
            --function-name epac-hansard-search-staging \
            --statement-id apigw-invoke-hansard-search \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:us-east-1:${ACCOUNT_ID}:${API_ID}/*/GET/api/v1/hansard/search" \
            2>/dev/null || true
          echo "| Lambda permission (apigw-invoke-hansard-search) | ensured |" >> "$GITHUB_STEP_SUMMARY"

          # --- IAM: S3 read/write on hansard-search prefix (put-role-policy is idempotent) ---
          aws iam put-role-policy \
            --role-name epac-lambda-role \
            --policy-name EpacArtifactsBucketHansardSearch \
            --policy-document '{
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "HansardSearchReadObjects",
                  "Effect": "Allow",
                  "Action": "s3:GetObject",
                  "Resource": "arn:aws:s3:::epac-artifacts-227530433709/hansard-search/*"
                },
                {
                  "Sid": "HansardSearchWriteObjects",
                  "Effect": "Allow",
                  "Action": "s3:PutObject",
                  "Resource": "arn:aws:s3:::epac-artifacts-227530433709/hansard-search/*"
                },
                {
                  "Sid": "HansardSearchListBucket",
                  "Effect": "Allow",
                  "Action": "s3:ListBucket",
                  "Resource": "arn:aws:s3:::epac-artifacts-227530433709",
                  "Condition": {
                    "StringLike": {
                      "s3:prefix": "hansard-search/*"
                    }
                  }
                }
              ]
            }'
          echo "| IAM EpacArtifactsBucketHansardSearch policy | ensured |" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ matrix.service }} to staging
    needs: [prepare, provision-search]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check service source exists
        id: service-source
        run: |
          set -euo pipefail
          if [ -f "backend/${{ matrix.service }}/go.mod" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Skipping staging deploy::backend/${{ matrix.service }}/go.mod does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: ${{ steps.service-source.outputs.exists == 'true' }}
        with:
          go-version-file: backend/${{ matrix.service }}/go.mod

      - name: Configure AWS credentials
        if: ${{ steps.service-source.outputs.exists == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Check staging Lambda exists
        id: staging-lambda
        if: ${{ steps.service-source.outputs.exists == 'true' }}
        env:
          FUNCTION_NAME: epac-${{ matrix.service }}-staging
        run: |
          set -euo pipefail
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Skipping staging deploy::${FUNCTION_NAME} does not exist. Apply staging Terraform before deploying this service."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and package Lambda
        if: ${{ steps.staging-lambda.outputs.exists == 'true' }}
        working-directory: backend
        run: make test package SERVICE=${{ matrix.service }}

      - name: Update staging Lambda
        if: ${{ steps.staging-lambda.outputs.exists == 'true' }}
        working-directory: backend/${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
          FUNCTION_NAME: epac-${{ matrix.service }}-staging
        run: |
          set -euo pipefail

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://function.zip
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

      - name: Sync staging DATABASE_URL from Secrets Manager
        if: ${{ steps.staging-lambda.outputs.exists == 'true' && contains(fromJson(needs.prepare.outputs.database_services), matrix.service) }}
        env:
          FUNCTION_NAME: epac-${{ matrix.service }}-staging
          DATABASE_URL_SECRET_ID: epac/database-url
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_STAGING }}
        run: |
          set -euo pipefail

          secret_error="$(mktemp)"
          if ! DATABASE_URL=$(aws secretsmanager get-secret-value \
              --secret-id "$DATABASE_URL_SECRET_ID" \
              --query SecretString \
              --output text 2>"$secret_error"); then
            if grep -q "marked for deletion" "$secret_error"; then
              echo "::warning title=Skipping DATABASE_URL refresh::${DATABASE_URL_SECRET_ID} is marked for deletion; preserving the current Lambda DATABASE_URL."
              DATABASE_URL=$(aws lambda get-function-configuration \
                --function-name "$FUNCTION_NAME" \
                --query 'Environment.Variables.DATABASE_URL' \
                --output text)
            else
              cat "$secret_error" >&2
              exit 1
            fi
          fi
          rm -f "$secret_error"
          if printf '%s' "$DATABASE_URL" | jq -e 'type == "object" and has("DATABASE_URL")' >/dev/null 2>&1; then
            DATABASE_URL=$(printf '%s' "$DATABASE_URL" | jq -r '.DATABASE_URL')
          fi
          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "None" ]; then
            echo "Secret ${DATABASE_URL_SECRET_ID} did not contain a DATABASE_URL value"
            exit 1
          fi

          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json)
          UPDATED_ENV=$(jq -cn \
            --argjson current "${CURRENT_ENV:-null}" \
            --arg database_url "$DATABASE_URL" \
            --arg sentry_dsn "$SENTRY_DSN" \
            '{Variables: (($current // {}) + {DATABASE_URL: $database_url} + (if $sentry_dsn != "" then {SENTRY_DSN: $sentry_dsn} else {} end))}')

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "$UPDATED_ENV" \
            >/dev/null
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

      - name: Sync staging artifact environment
        if: ${{ steps.staging-lambda.outputs.exists == 'true' && contains(fromJson(needs.prepare.outputs.artifact_services), matrix.service) }}
        env:
          SERVICE: ${{ matrix.service }}
          FUNCTION_NAME: epac-${{ matrix.service }}-staging
          ARTIFACT_BUCKET: ${{ vars.EPAC_ARTIFACT_BUCKET_STAGING || vars.EPAC_ARTIFACT_BUCKET || vars.ARTIFACTS_BUCKET || 'epac-artifacts-227530433709' }}
          ARTIFACT_PREFIX: ${{ vars.EPAC_ARTIFACT_PREFIX_STAGING || vars.EPAC_ARTIFACT_PREFIX }}
          HANSARD_SEARCH_PREFIX: ${{ vars.EPAC_HANSARD_SEARCH_PREFIX || 'hansard-search/v1' }}
          PARLIAMENT_NUMBER: ${{ vars.EPAC_HANSARD_PARLIAMENT_NUMBER || '45' }}
          SESSION_NUMBER: ${{ vars.EPAC_HANSARD_SESSION_NUMBER || '1' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_STAGING }}
        run: |
          set -euo pipefail

          if [ -z "$ARTIFACT_BUCKET" ]; then
            echo "EPAC_ARTIFACT_BUCKET_STAGING, EPAC_ARTIFACT_BUCKET, or ARTIFACTS_BUCKET variable is required"
            exit 1
          fi

          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json)
          UPDATED_ENV=$(jq -cn \
            --argjson current "${CURRENT_ENV:-null}" \
            --arg service "$SERVICE" \
            --arg artifact_bucket "$ARTIFACT_BUCKET" \
            --arg artifact_prefix "$ARTIFACT_PREFIX" \
            --arg hansard_search_prefix "$HANSARD_SEARCH_PREFIX" \
            --arg parliament_number "$PARLIAMENT_NUMBER" \
            --arg session_number "$SESSION_NUMBER" \
            --arg sentry_dsn "$SENTRY_DSN" \
            '{Variables: ((($current // {}) | del(.DATABASE_URL)) + {EPAC_ARTIFACT_BUCKET: $artifact_bucket} + (if $artifact_prefix != "" then {EPAC_ARTIFACT_PREFIX: $artifact_prefix} else {} end) + (if $service == "hansard-search-index" then {EPAC_HANSARD_SEARCH_PREFIX: $hansard_search_prefix, PARLIAMENT_NUMBER: $parliament_number, SESSION_NUMBER: $session_number} else {} end) + (if $sentry_dsn != "" then {SENTRY_DSN: $sentry_dsn} else {} end))}')

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "$UPDATED_ENV" \
            >/dev/null
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

  smoke:
    name: Smoke test staging backend
    runs-on: ubuntu-latest
    needs: deploy
    env:
      STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL || 'https://staging-api.epac.riddimsoftware.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Check staging smoke readiness
        id: smoke-readiness
        run: |
          set -euo pipefail
          missing=()
          while IFS= read -r service; do
            function_name="epac-${service}-staging"
            if ! aws lambda get-function --function-name "$function_name" >/dev/null 2>&1; then
              missing+=("$function_name")
            fi
          done < <(jq -r '.services[] | select(.http != null and .deploy.staging == true) | .name' backend/manifest/deployment-services.json)

          if [ "${#missing[@]}" -gt 0 ]; then
            IFS=', '
            echo "::warning title=Skipping staging smoke tests::Missing staging Lambda functions: ${missing[*]}. Apply staging Terraform before running full smoke coverage."
            {
              echo "## Backend staging smoke tests"
              echo
              echo "Skipped because these staging Lambda functions are not provisioned:"
              printf -- "- %s\n" "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure staging routes are synced
        if: ${{ steps.smoke-readiness.outputs.ready == 'true' }}
        env:
          ENV_NAME: staging
          STAGE_NAME: staging
        run: ./scripts/ci/ensure-staging-api-routes.sh

      - name: Run staging backend smoke tests
        if: ${{ steps.smoke-readiness.outputs.ready == 'true' }}
        env:
          EPAC_ARTIFACT_BUCKET: ${{ vars.EPAC_ARTIFACT_BUCKET_STAGING || vars.EPAC_ARTIFACT_BUCKET || vars.ARTIFACTS_BUCKET || 'epac-artifacts-227530433709' }}
          EPAC_HANSARD_SEARCH_PREFIX: ${{ vars.EPAC_HANSARD_SEARCH_PREFIX || 'hansard-search/v1' }}
        run: python3 scripts/ci/backend_staging_smoke.py --base-url "$STAGING_API_BASE_URL"
