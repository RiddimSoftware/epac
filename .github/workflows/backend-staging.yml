name: Backend Staging Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-staging.yml'
  workflow_dispatch:

concurrency:
  group: backend-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ matrix.service }} to staging
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [daily-fetch, loader, search, member-speeches, on-this-day, riding-boundary, health, device-register, openapi, live-status]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/${{ matrix.service }}/go.mod

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Test and package Lambda
        working-directory: backend/${{ matrix.service }}
        run: |
          go test ./...
          GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -o bootstrap main.go
          zip -q function.zip bootstrap

      - name: Update staging Lambda
        working-directory: backend/${{ matrix.service }}
        env:
          FUNCTION_NAME: epac-${{ matrix.service }}-staging
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://function.zip

      - name: Sync staging DATABASE_URL from Secrets Manager
        if: ${{ contains(fromJSON('["daily-fetch","search","member-speeches"]'), matrix.service) }}
        env:
          FUNCTION_NAME: epac-${{ matrix.service }}-staging
          DATABASE_URL_SECRET_ID: epac/database-url
        run: |
          set -euo pipefail

          DATABASE_URL=$(aws secretsmanager get-secret-value \
            --secret-id "$DATABASE_URL_SECRET_ID" \
            --query SecretString \
            --output text)
          if printf '%s' "$DATABASE_URL" | jq -e 'type == "object" and has("DATABASE_URL")' >/dev/null 2>&1; then
            DATABASE_URL=$(printf '%s' "$DATABASE_URL" | jq -r '.DATABASE_URL')
          fi
          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "None" ]; then
            echo "Secret ${DATABASE_URL_SECRET_ID} did not contain a DATABASE_URL value"
            exit 1
          fi

          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json)
          UPDATED_ENV=$(jq -cn \
            --argjson current "${CURRENT_ENV:-null}" \
            --arg database_url "$DATABASE_URL" \
            '{Variables: (($current // {}) + {DATABASE_URL: $database_url})}')

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "$UPDATED_ENV" \
            >/dev/null

      - name: Ensure search speeches route
        if: ${{ matrix.service == 'search' }}
        env:
          API_NAME: epac-api-api
          FUNCTION_NAME: epac-search-staging
          ROUTE_KEY: GET /search/speeches
          STATEMENT_ID: apigateway-search-speeches-staging
        run: |
          set -euo pipefail
          API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='${API_NAME}'].ApiId | [0]" \
            --output text)
          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            echo "API ${API_NAME} not found"
            exit 1
          fi

          LAMBDA_ARN=$(aws lambda get-function \
            --function-name "$FUNCTION_NAME" \
            --query 'Configuration.FunctionArn' \
            --output text)
          INTEGRATION_ID=$(aws apigatewayv2 get-integrations \
            --api-id "$API_ID" \
            --query "Items[?IntegrationUri=='${LAMBDA_ARN}'].IntegrationId | [0]" \
            --output text)
          if [ -z "$INTEGRATION_ID" ] || [ "$INTEGRATION_ID" = "None" ]; then
            INTEGRATION_ID=$(aws apigatewayv2 create-integration \
              --api-id "$API_ID" \
              --integration-type AWS_PROXY \
              --integration-uri "$LAMBDA_ARN" \
              --payload-format-version 2.0 \
              --query 'IntegrationId' \
              --output text)
          fi

          ROUTE_ID=$(aws apigatewayv2 get-routes \
            --api-id "$API_ID" \
            --query "Items[?RouteKey=='${ROUTE_KEY}'].RouteId | [0]" \
            --output text)
          if [ -z "$ROUTE_ID" ] || [ "$ROUTE_ID" = "None" ]; then
            aws apigatewayv2 create-route \
              --api-id "$API_ID" \
              --route-key "$ROUTE_KEY" \
              --target "integrations/${INTEGRATION_ID}" >/dev/null
          else
            aws apigatewayv2 update-route \
              --api-id "$API_ID" \
              --route-id "$ROUTE_ID" \
              --target "integrations/${INTEGRATION_ID}" >/dev/null
          fi

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${AWS_REGION:-us-east-1}"
          aws lambda add-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id "$STATEMENT_ID" \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:${REGION}:${ACCOUNT_ID}:${API_ID}/*/*/search/speeches" \
            >/dev/null 2>&1 || true
