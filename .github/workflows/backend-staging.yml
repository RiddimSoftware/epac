name: Backend Staging Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-staging.yml'
      - 'scripts/ci/backend_staging_smoke.py'
      - 'scripts/ci/check_backend_manifest_deployment.py'
      - 'scripts/ci/ensure-staging-api-routes.sh'
      - 'scripts/ci/provision-s3-http-lambdas.sh'
      - 'backend/manifest/deployment-services.json'
  workflow_dispatch:

concurrency:
  group: backend-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_RETRY_MODE: standard
  AWS_MAX_ATTEMPTS: '5'
  AWS_CLI_CONNECT_TIMEOUT: '10'
  AWS_CLI_READ_TIMEOUT: '60'

jobs:
  prepare:
    name: Resolve backend service manifest
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.resolve.outputs.services }}
      database_services: ${{ steps.resolve.outputs.database_services }}
      artifact_services: ${{ steps.resolve.outputs.artifact_services }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          SERVICES=$(jq -c '[.services[] | select(.deploy.staging == true) | .name]' backend/manifest/deployment-services.json)
          DATABASE_SERVICES=$(jq -c '[.services[] | select(.sync.staging.database == true) | .name]' backend/manifest/deployment-services.json)
          ARTIFACT_SERVICES=$(jq -c '[.services[] | select(.sync.staging.artifact == true) | .name]' backend/manifest/deployment-services.json)

          if [ "$SERVICES" = "[]" ]; then
            echo "No staging services found in manifest" >&2
            exit 1
          fi

          {
            echo "services=$SERVICES"
            echo "database_services=$DATABASE_SERVICES"
            echo "artifact_services=$ARTIFACT_SERVICES"
          } >> "$GITHUB_OUTPUT"

  provision-search:
    name: Provision staging search Lambdas and API route
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Provision search Lambdas and API Gateway route
        env:
          LAMBDA_ROLE: arn:aws:iam::227530433709:role/epac-lambda-role
          API_ID: f4x35gduxl
          ACCOUNT_ID: '227530433709'
        run: |
          set -euo pipefail

          {
            echo "## Provision staging search resources"
            echo ""
            echo "| Resource | Outcome |"
            echo "|----------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"

          # --- epac-hansard-search-index-staging Lambda ---
          if ! aws lambda get-function --function-name epac-hansard-search-index-staging > /dev/null 2>&1; then
            aws lambda create-function \
              --function-name epac-hansard-search-index-staging \
              --runtime provided.al2023 \
              --handler bootstrap \
              --architectures arm64 \
              --role "$LAMBDA_ROLE" \
              --zip-file fileb://infra/placeholder.zip \
              --timeout 900 \
              --memory-size 1024
            aws lambda wait function-active-v2 --function-name epac-hansard-search-index-staging
            echo "| epac-hansard-search-index-staging | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            aws lambda update-function-configuration \
              --function-name epac-hansard-search-index-staging \
              --timeout 900 \
              --memory-size 1024 \
              >/dev/null
            aws lambda wait function-updated --function-name epac-hansard-search-index-staging
            echo "| epac-hansard-search-index-staging | already existed, config ensured |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- epac-hansard-search-staging Lambda ---
          if ! aws lambda get-function --function-name epac-hansard-search-staging > /dev/null 2>&1; then
            aws lambda create-function \
              --function-name epac-hansard-search-staging \
              --runtime provided.al2023 \
              --handler bootstrap \
              --architectures arm64 \
              --role "$LAMBDA_ROLE" \
              --zip-file fileb://infra/placeholder.zip \
              --timeout 30 \
              --memory-size 128
            aws lambda wait function-active-v2 --function-name epac-hansard-search-staging
            echo "| epac-hansard-search-staging | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            aws lambda update-function-configuration \
              --function-name epac-hansard-search-staging \
              --timeout 30 \
              >/dev/null
            aws lambda wait function-updated --function-name epac-hansard-search-staging
            echo "| epac-hansard-search-staging | already existed, config ensured |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- API Gateway integration for hansard-search ---
          EXISTING_INTEGRATION_ID=$(aws apigatewayv2 get-integrations --api-id "$API_ID" \
            --query "Items[?IntegrationUri=='arn:aws:lambda:us-east-1:${ACCOUNT_ID}:function:epac-hansard-search-staging'].IntegrationId | [0]" \
            --output text)

          if [ "$EXISTING_INTEGRATION_ID" = "None" ] || [ -z "$EXISTING_INTEGRATION_ID" ]; then
            INTEGRATION_ID=$(aws apigatewayv2 create-integration \
              --api-id "$API_ID" \
              --integration-type AWS_PROXY \
              --integration-uri "arn:aws:lambda:us-east-1:${ACCOUNT_ID}:function:epac-hansard-search-staging" \
              --payload-format-version 2.0 \
              --query IntegrationId --output text)
            echo "| API Gateway integration | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            INTEGRATION_ID="$EXISTING_INTEGRATION_ID"
            echo "| API Gateway integration | already existed, skipped |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- API Gateway route ---
          ROUTE_ID=$(aws apigatewayv2 get-routes --api-id "$API_ID" \
            --query "Items[?RouteKey=='GET /api/v1/hansard/search'].RouteId | [0]" \
            --output text)

          if [ "$ROUTE_ID" = "None" ] || [ -z "$ROUTE_ID" ]; then
            aws apigatewayv2 create-route \
              --api-id "$API_ID" \
              --route-key "GET /api/v1/hansard/search" \
              --target "integrations/${INTEGRATION_ID}"
            echo "| GET /api/v1/hansard/search route | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| GET /api/v1/hansard/search route | already existed, skipped |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- Lambda permission (add-permission is not idempotent; suppress duplicate error) ---
          aws lambda add-permission \
            --function-name epac-hansard-search-staging \
            --statement-id apigw-invoke-hansard-search \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:us-east-1:${ACCOUNT_ID}:${API_ID}/*/GET/api/v1/hansard/search" \
            2>/dev/null || true
          echo "| Lambda permission (apigw-invoke-hansard-search) | ensured |" >> "$GITHUB_STEP_SUMMARY"

  provision-lobbying:
    name: Provision staging lobbying Lambda and API routes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Provision lobbying Lambda and API Gateway routes
        env:
          LAMBDA_ROLE: arn:aws:iam::227530433709:role/epac-lambda-role
          API_ID: f4x35gduxl
          ACCOUNT_ID: '227530433709'
        run: |
          set -euo pipefail

          {
            echo "## Provision staging lobbying resources"
            echo ""
            echo "| Resource | Outcome |"
            echo "|----------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"

          # --- epac-lobbying-staging Lambda ---
          if ! aws lambda get-function --function-name epac-lobbying-staging > /dev/null 2>&1; then
            aws lambda create-function \
              --function-name epac-lobbying-staging \
              --runtime provided.al2023 \
              --handler bootstrap \
              --architectures arm64 \
              --role "$LAMBDA_ROLE" \
              --zip-file fileb://infra/placeholder.zip \
              --timeout 30 \
              --memory-size 512 \
              --ephemeral-storage '{"Size":2048}'
            aws lambda wait function-active-v2 --function-name epac-lobbying-staging
            echo "| epac-lobbying-staging | created with 2048 MB ephemeral storage |" >> "$GITHUB_STEP_SUMMARY"
          else
            aws lambda update-function-configuration \
              --function-name epac-lobbying-staging \
              --timeout 30 \
              --memory-size 512 \
              --ephemeral-storage '{"Size":2048}' \
              >/dev/null
            aws lambda wait function-updated --function-name epac-lobbying-staging
            echo "| epac-lobbying-staging | already existed, serving config ensured |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- API Gateway integration for lobbying ---
          EXISTING_INTEGRATION_ID=$(aws apigatewayv2 get-integrations --api-id "$API_ID" \
            --query "Items[?IntegrationUri=='arn:aws:lambda:us-east-1:${ACCOUNT_ID}:function:epac-lobbying-staging'].IntegrationId | [0]" \
            --output text)

          if [ "$EXISTING_INTEGRATION_ID" = "None" ] || [ -z "$EXISTING_INTEGRATION_ID" ]; then
            INTEGRATION_ID=$(aws apigatewayv2 create-integration \
              --api-id "$API_ID" \
              --integration-type AWS_PROXY \
              --integration-uri "arn:aws:lambda:us-east-1:${ACCOUNT_ID}:function:epac-lobbying-staging" \
              --payload-format-version 2.0 \
              --query IntegrationId --output text)
            echo "| API Gateway integration | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            INTEGRATION_ID="$EXISTING_INTEGRATION_ID"
            echo "| API Gateway integration | already existed, skipped |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- API Gateway routes (read from manifest) ---
          while IFS= read -r route_key; do
            ROUTE_ID=$(aws apigatewayv2 get-routes --api-id "$API_ID" \
              --query "Items[?RouteKey=='${route_key}'].RouteId | [0]" \
              --output text)
            if [ "$ROUTE_ID" = "None" ] || [ -z "$ROUTE_ID" ]; then
              aws apigatewayv2 create-route \
                --api-id "$API_ID" \
                --route-key "$route_key" \
                --target "integrations/${INTEGRATION_ID}"
              echo "| ${route_key} route | created |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| ${route_key} route | already existed, skipped |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(jq -r '.services[] | select(.name == "lobbying") | .http.routes.staging[] | "\(.method) \(.path)"' backend/manifest/deployment-services.json)

          # --- Lambda permission (add-permission is not idempotent; suppress duplicate error) ---
          aws lambda add-permission \
            --function-name epac-lobbying-staging \
            --statement-id apigw-invoke-lobbying \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:us-east-1:${ACCOUNT_ID}:${API_ID}/*/*" \
            2>/dev/null || true
          echo "| Lambda permission (apigw-invoke-lobbying) | ensured |" >> "$GITHUB_STEP_SUMMARY"

  provision-s3-http:
    name: Provision staging standard S3 HTTP Lambdas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Provision standard S3 HTTP Lambdas
        env:
          ENV_NAME: staging
          API_ID: f4x35gduxl
          ACCOUNT_ID: '227530433709'
          LAMBDA_ROLE: arn:aws:iam::227530433709:role/epac-lambda-role
        run: ./scripts/ci/provision-s3-http-lambdas.sh

  provision-lobbying-index:
    name: Provision staging lobbying-index Lambda and state machine
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Provision lobbying-index Lambda and state machine
        env:
          LOBBYING_INDEX_FUNCTION_NAME: epac-lobbying-index-staging
          LOBBYING_INDEX_STATE_MACHINE_NAME: epac-lobbying-index-staging
          LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME: epac-lobbying-index-staging-state-machine-role
          LAMBDA_ROLE: arn:aws:iam::227530433709:role/epac-lambda-role
          ACCOUNT_ID: '227530433709'
        run: |
          set -euo pipefail

          echo "Provisioning staging lobbying-index Lambda and Step Functions state machine"

          LOBBYING_INDEX_LAMBDA_ARN="arn:aws:lambda:us-east-1:${ACCOUNT_ID}:function:${LOBBYING_INDEX_FUNCTION_NAME}"
          STATE_MACHINE_ARN="arn:aws:states:us-east-1:${ACCOUNT_ID}:stateMachine:${LOBBYING_INDEX_STATE_MACHINE_NAME}"
          STATE_MACHINE_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME}"

          {
            echo "## Provision staging lobbying-index resources"
            echo ""
            echo "| Resource | Outcome |"
            echo "|----------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"

          # --- epac-lobbying-index-staging Lambda (one 900 s budget per state-machine phase) ---
          echo "Ensuring ${LOBBYING_INDEX_FUNCTION_NAME} Lambda has 900 s timeout and 4096 MB memory"
          if ! aws lambda get-function --function-name "$LOBBYING_INDEX_FUNCTION_NAME" > /dev/null 2>&1; then
            aws lambda create-function \
              --function-name "$LOBBYING_INDEX_FUNCTION_NAME" \
              --runtime provided.al2023 \
              --handler bootstrap \
              --architectures arm64 \
              --role "$LAMBDA_ROLE" \
              --zip-file fileb://infra/placeholder.zip \
              --timeout 900 \
              --memory-size 4096
            aws lambda wait function-active-v2 --function-name "$LOBBYING_INDEX_FUNCTION_NAME"
            echo "| ${LOBBYING_INDEX_FUNCTION_NAME} Lambda | created with 900 s timeout / 4096 MB |" >> "$GITHUB_STEP_SUMMARY"
          else
            aws lambda update-function-configuration \
              --function-name "$LOBBYING_INDEX_FUNCTION_NAME" \
              --timeout 900 \
              --memory-size 4096 \
              >/dev/null
            aws lambda wait function-updated --function-name "$LOBBYING_INDEX_FUNCTION_NAME"
            echo "| ${LOBBYING_INDEX_FUNCTION_NAME} Lambda | already existed, per-phase config ensured |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- Step Functions execution role (states.amazonaws.com -> Lambda invoke) ---
          echo "Ensuring ${LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME} can be assumed by Step Functions and invoke the Lambda"
          TRUST_POLICY=$(jq -cn '{
            Version: "2012-10-17",
            Statement: [
              {
                Effect: "Allow",
                Principal: {Service: "states.amazonaws.com"},
                Action: "sts:AssumeRole"
              }
            ]
          }')
          INVOKE_POLICY=$(jq -cn --arg lambda_arn "$LOBBYING_INDEX_LAMBDA_ARN" '{
            Version: "2012-10-17",
            Statement: [
              {
                Sid: "InvokeLobbyingIndexLambda",
                Effect: "Allow",
                Action: "lambda:InvokeFunction",
                Resource: [$lambda_arn, ($lambda_arn + ":*")]
              }
            ]
          }')

          if ! aws iam get-role --role-name "$LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME" > /dev/null 2>&1; then
            aws iam create-role \
              --role-name "$LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME" \
              --assume-role-policy-document "$TRUST_POLICY" \
              >/dev/null
            aws iam wait role-exists --role-name "$LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME"
            echo "| ${LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME} | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            aws iam update-assume-role-policy \
              --role-name "$LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME" \
              --policy-document "$TRUST_POLICY" \
              >/dev/null
            echo "| ${LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME} | already existed, trust ensured |" >> "$GITHUB_STEP_SUMMARY"
          fi

          aws iam put-role-policy \
            --role-name "$LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME" \
            --policy-name EpacLobbyingIndexInvokeLambda \
            --policy-document "$INVOKE_POLICY" \
            >/dev/null
          echo "| Step Functions Lambda invoke policy | ensured |" >> "$GITHUB_STEP_SUMMARY"

          # IAM role/policy propagation is eventually consistent.
          echo "Waiting 10 s for IAM role and policy propagation"
          sleep 10

          echo "Rendering infra/lobbying-index.asl.json for ${LOBBYING_INDEX_LAMBDA_ARN}"
          STATE_MACHINE_DEFINITION=$(jq -c \
            --arg lambda_arn "$LOBBYING_INDEX_LAMBDA_ARN" \
            '(.States[] | select(.Type == "Task") | .Parameters.FunctionName) = $lambda_arn' \
            infra/lobbying-index.asl.json)

          # --- epac-lobbying-index-staging Step Functions state machine ---
          echo "Ensuring ${LOBBYING_INDEX_STATE_MACHINE_NAME} Step Functions state machine exists"
          if ! aws stepfunctions describe-state-machine --state-machine-arn "$STATE_MACHINE_ARN" > /dev/null 2>&1; then
            aws stepfunctions create-state-machine \
              --name "$LOBBYING_INDEX_STATE_MACHINE_NAME" \
              --definition "$STATE_MACHINE_DEFINITION" \
              --role-arn "$STATE_MACHINE_ROLE_ARN" \
              --type STANDARD \
              >/dev/null
            echo "| ${LOBBYING_INDEX_STATE_MACHINE_NAME} state machine | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            aws stepfunctions update-state-machine \
              --state-machine-arn "$STATE_MACHINE_ARN" \
              --definition "$STATE_MACHINE_DEFINITION" \
              --role-arn "$STATE_MACHINE_ROLE_ARN" \
              >/dev/null
            echo "| ${LOBBYING_INDEX_STATE_MACHINE_NAME} state machine | updated |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "Provisioned staging lobbying-index Lambda and Step Functions state machine"

  assert-staging-topology:
    name: Check staging S3 HTTP manifest topology
    needs: [provision-search, provision-lobbying, provision-s3-http]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Ensure staging routes are synced
        env:
          ENV_NAME: staging
          STAGE_NAME: staging
          API_ID: f4x35gduxl
        run: ./scripts/ci/ensure-staging-api-routes.sh

      - name: Check staging manifest topology
        env:
          EPAC_ARTIFACT_BUCKET: ${{ vars.EPAC_ARTIFACT_BUCKET_STAGING || vars.EPAC_ARTIFACT_BUCKET || vars.ARTIFACTS_BUCKET || 'epac-artifacts-227530433709' }}
        run: |
          python3 scripts/ci/check_backend_manifest_deployment.py \
            --environment staging \
            --api-id f4x35gduxl \
            --artifact-bucket "$EPAC_ARTIFACT_BUCKET" \
            --phase topology

  deploy:
    name: Deploy ${{ matrix.service }} to staging
    needs: [prepare, provision-lobbying-index, assert-staging-topology]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check service source exists
        id: service-source
        run: |
          set -euo pipefail
          if [ -f "backend/${{ matrix.service }}/go.mod" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Skipping staging deploy::backend/${{ matrix.service }}/go.mod does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: ${{ steps.service-source.outputs.exists == 'true' }}
        with:
          go-version-file: backend/${{ matrix.service }}/go.mod

      - name: Configure AWS credentials
        if: ${{ steps.service-source.outputs.exists == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Check staging Lambda exists
        id: staging-lambda
        if: ${{ steps.service-source.outputs.exists == 'true' }}
        env:
          FUNCTION_NAME: epac-${{ matrix.service }}-staging
        run: |
          set -euo pipefail
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            IS_S3_HTTP_ARTIFACT=$(jq -r --arg service "${{ matrix.service }}" 'first(.services[] | select(.name == $service) | select(.deploy.staging == true and .http != null and .sync.staging.artifact == true) | "true") // "false"' backend/manifest/deployment-services.json)
            if [ "$IS_S3_HTTP_ARTIFACT" = "true" ]; then
              echo "::error title=Missing staging Lambda::${FUNCTION_NAME} does not exist for a manifest-declared S3 HTTP service."
              exit 1
            fi
            echo "::warning title=Skipping staging deploy::${FUNCTION_NAME} does not exist. This service is outside the S3 HTTP manifest enforcement scope."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and package Lambda
        if: ${{ steps.staging-lambda.outputs.exists == 'true' }}
        working-directory: backend
        run: make test package SERVICE=${{ matrix.service }}

      - name: Update staging Lambda
        if: ${{ steps.staging-lambda.outputs.exists == 'true' }}
        working-directory: backend/${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
          FUNCTION_NAME: epac-${{ matrix.service }}-staging
        run: |
          set -euo pipefail

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://function.zip
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

      - name: Sync staging DATABASE_URL from Parameter Store
        if: ${{ steps.staging-lambda.outputs.exists == 'true' && contains(fromJson(needs.prepare.outputs.database_services), matrix.service) }}
        env:
          FUNCTION_NAME: epac-${{ matrix.service }}-staging
          DATABASE_URL_PARAMETER_NAME: /epac/database-url
        run: |
          set -euo pipefail

          secret_error="$(mktemp)"
          if ! DATABASE_URL=$(aws ssm get-parameter \
              --name "$DATABASE_URL_PARAMETER_NAME" \
              --with-decryption \
              --query Parameter.Value \
              --output text 2>"$secret_error"); then
            if grep -q "Parameter has been marked for deletion" "$secret_error"; then
              echo "::warning title=Skipping DATABASE_URL refresh::${DATABASE_URL_PARAMETER_NAME} is marked for deletion; preserving the current Lambda DATABASE_URL."
              DATABASE_URL=$(aws lambda get-function-configuration \
                --function-name "$FUNCTION_NAME" \
                --query 'Environment.Variables.DATABASE_URL' \
                --output text)
            else
              cat "$secret_error" >&2
              exit 1
            fi
          fi
          rm -f "$secret_error"
          if printf '%s' "$DATABASE_URL" | jq -e 'type == "object" and has("DATABASE_URL")' >/dev/null 2>&1; then
            DATABASE_URL=$(printf '%s' "$DATABASE_URL" | jq -r '.DATABASE_URL')
          fi
          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "None" ]; then
            echo "Secret ${DATABASE_URL_PARAMETER_NAME} did not contain a DATABASE_URL value"
            exit 1
          fi

          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json)
          UPDATED_ENV=$(jq -cn \
            --argjson current "${CURRENT_ENV:-null}" \
            --arg database_url "$DATABASE_URL" \
            '{Variables: (($current // {}) + {DATABASE_URL: $database_url})}')

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "$UPDATED_ENV" \
            >/dev/null
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

      - name: Sync staging artifact environment
        if: ${{ steps.staging-lambda.outputs.exists == 'true' && contains(fromJson(needs.prepare.outputs.artifact_services), matrix.service) }}
        env:
          SERVICE: ${{ matrix.service }}
          FUNCTION_NAME: epac-${{ matrix.service }}-staging
          ARTIFACT_BUCKET: ${{ vars.EPAC_ARTIFACT_BUCKET_STAGING || vars.EPAC_ARTIFACT_BUCKET || vars.ARTIFACTS_BUCKET || 'epac-artifacts-227530433709' }}
          ARTIFACT_PREFIX: ${{ vars.EPAC_ARTIFACT_PREFIX_STAGING || vars.EPAC_ARTIFACT_PREFIX }}
          HANSARD_SEARCH_PREFIX: ${{ vars.EPAC_HANSARD_SEARCH_PREFIX || 'hansard-search/v1' }}
          PARLIAMENT_NUMBER: ${{ vars.EPAC_HANSARD_PARLIAMENT_NUMBER || '45' }}
          SESSION_NUMBER: ${{ vars.EPAC_HANSARD_SESSION_NUMBER || '1' }}
          LOBBYING_INDEX_PREFIX: ${{ vars.EPAC_LOBBYING_INDEX_PREFIX || 'lobbying-index/v1' }}
          BILLS_INDEX_PREFIX: ${{ vars.EPAC_BILLS_INDEX_PREFIX || 'bills/v1' }}
          MEMBERS_INDEX_PREFIX: ${{ vars.EPAC_MEMBERS_INDEX_PREFIX || 'members/v1' }}
        run: |
          set -euo pipefail

          if [ -z "$ARTIFACT_BUCKET" ]; then
            echo "EPAC_ARTIFACT_BUCKET_STAGING, EPAC_ARTIFACT_BUCKET, or ARTIFACTS_BUCKET variable is required"
            exit 1
          fi

          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json)
          UPDATED_ENV=$(jq -cn \
            --argjson current "${CURRENT_ENV:-null}" \
            --arg service "$SERVICE" \
            --arg artifact_bucket "$ARTIFACT_BUCKET" \
            --arg artifact_prefix "$ARTIFACT_PREFIX" \
            --arg hansard_search_prefix "$HANSARD_SEARCH_PREFIX" \
            --arg parliament_number "$PARLIAMENT_NUMBER" \
            --arg session_number "$SESSION_NUMBER" \
            --arg lobbying_index_prefix "$LOBBYING_INDEX_PREFIX" \
            --arg bills_index_prefix "$BILLS_INDEX_PREFIX" \
            --arg members_index_prefix "$MEMBERS_INDEX_PREFIX" \
            '{Variables: ((($current // {}) | del(.DATABASE_URL)) + {EPAC_ARTIFACT_BUCKET: $artifact_bucket} + (if $artifact_prefix != "" then {EPAC_ARTIFACT_PREFIX: $artifact_prefix} else {} end) + (if $service == "hansard-search-index" then {EPAC_HANSARD_SEARCH_PREFIX: $hansard_search_prefix, PARLIAMENT_NUMBER: $parliament_number, SESSION_NUMBER: $session_number} else {} end) + (if $service == "lobbying-index" or $service == "lobbying" then {LOBBYING_INDEX_PREFIX: $lobbying_index_prefix} else {} end) + (if $service == "bills" then {BILLS_INDEX_PREFIX: $bills_index_prefix} else {} end) + (if $service == "members" then {MEMBERS_INDEX_PREFIX: $members_index_prefix} else {} end))}')

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "$UPDATED_ENV" \
            >/dev/null
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

  smoke:
    name: Smoke test staging backend
    runs-on: ubuntu-latest
    needs: deploy

    env:
      STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL || 'https://staging-api.epac.riddimsoftware.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Resolve staging smoke services
        id: smoke-services
        run: |
          set -euo pipefail
          available_file="$(mktemp)"
          missing_file="$(mktemp)"
          while IFS= read -r service; do
            function_name="epac-${service}-staging"
            if aws lambda get-function --function-name "$function_name" >/dev/null 2>&1; then
              printf '%s\n' "$service" >> "$available_file"
            else
              printf '%s\n' "$function_name" >> "$missing_file"
            fi
          done < <(jq -r '.services[] | select(.http != null and .deploy.staging == true) | .name' backend/manifest/deployment-services.json)

          available_services="$(jq -R . "$available_file" | jq -cs .)"
          missing_functions="$(jq -R . "$missing_file" | jq -cs .)"
          available_count="$(jq 'length' <<< "$available_services")"
          missing_count="$(jq 'length' <<< "$missing_functions")"

          echo "available_services=$available_services" >> "$GITHUB_OUTPUT"

          if [ "$missing_count" -gt 0 ]; then
            missing_text="$(jq -r 'join(", ")' <<< "$missing_functions")"
            echo "::warning title=Partial staging smoke coverage::Skipping checks for missing staging Lambda functions: ${missing_text}."
            {
              echo "## Backend staging smoke tests"
              echo
              echo "Smoke tests will run for available scripted staging services."
              echo
              echo "Missing Lambda functions whose checks will be skipped:"
              jq -r '.[] | "- " + .' <<< "$missing_functions"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$available_count" -eq 0 ]; then
            echo "No deployed staging Lambda functions are available for smoke tests." >&2
            exit 1
          fi

      - name: Ensure staging routes are synced
        env:
          ENV_NAME: staging
          STAGE_NAME: staging
          API_ID: f4x35gduxl
        run: ./scripts/ci/ensure-staging-api-routes.sh

      - name: Check staging S3 HTTP manifest readiness
        env:
          EPAC_ARTIFACT_BUCKET: ${{ vars.EPAC_ARTIFACT_BUCKET_STAGING || vars.EPAC_ARTIFACT_BUCKET || vars.ARTIFACTS_BUCKET || 'epac-artifacts-227530433709' }}
          EPAC_HANSARD_SEARCH_PREFIX: ${{ vars.EPAC_HANSARD_SEARCH_PREFIX || 'hansard-search/v1' }}
          LOBBYING_INDEX_PREFIX: ${{ vars.EPAC_LOBBYING_INDEX_PREFIX || 'lobbying-index/v1' }}
          BILLS_INDEX_PREFIX: ${{ vars.EPAC_BILLS_INDEX_PREFIX || 'bills/v1' }}
          MEMBERS_INDEX_PREFIX: ${{ vars.EPAC_MEMBERS_INDEX_PREFIX || 'members/v1' }}
        run: |
          python3 scripts/ci/check_backend_manifest_deployment.py \
            --environment staging \
            --api-id f4x35gduxl \
            --artifact-bucket "$EPAC_ARTIFACT_BUCKET" \
            --phase ready

      - name: Run staging backend smoke tests
        env:
          EPAC_ARTIFACT_BUCKET: ${{ vars.EPAC_ARTIFACT_BUCKET_STAGING || vars.EPAC_ARTIFACT_BUCKET || vars.ARTIFACTS_BUCKET || 'epac-artifacts-227530433709' }}
          EPAC_HANSARD_SEARCH_PREFIX: ${{ vars.EPAC_HANSARD_SEARCH_PREFIX || 'hansard-search/v1' }}
          EPAC_BACKEND_SMOKE_ENVIRONMENT: staging
          EPAC_BACKEND_SMOKE_SERVICES: ${{ steps.smoke-services.outputs.available_services }}
        run: python3 scripts/ci/backend_staging_smoke.py --environment staging --base-url "$STAGING_API_BASE_URL"
