name: Lobbying Index Reindex

on:
  # OCL open data updates approximately quarterly (Jan, Apr, Jul, Oct).
  # The Monday-at-noon run fires the week after each quarterly drop so the
  # index is refreshed promptly after new data appears.
  # The 1st-of-every-3rd-month run provides a reliable calendar anchor so
  # the index is never more than one quarter stale even if the Monday run
  # is missed or the OCL cadence shifts slightly.
  # Scheduled runs always target production; use workflow_dispatch for staging.
  schedule:
    - cron: '0 12 * * 1'    # Monday 08:00 EDT — first weekday run after quarterly OCL updates
    - cron: '0 12 1 */3 *'  # 1st of every 3rd month — quarterly calendar anchor
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to reindex
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: lobbying-reindex-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  reindex:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.environment || 'production' }}
      STATE_MACHINE_ARN: arn:aws:states:us-east-1:227530433709:stateMachine:epac-lobbying-index-${{ inputs.environment || 'production' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ (inputs.environment || 'production') == 'production' && secrets.AWS_BACKEND_PRODUCTION_ROLE_ARN || secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Start execution
        id: start
        run: |
          set -euo pipefail
          EXECUTION_ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "$STATE_MACHINE_ARN" \
            --input '{}' \
            --query 'executionArn' \
            --output text)
          echo "execution_arn=$EXECUTION_ARN" >> "$GITHUB_OUTPUT"
          echo "Started execution: $EXECUTION_ARN"

      - name: Poll to completion
        env:
          EXECUTION_ARN: ${{ steps.start.outputs.execution_arn }}
        run: |
          set -euo pipefail

          POLL_INTERVAL=30
          MAX_WAIT=3600
          ELAPSED=0

          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            RESULT=$(aws stepfunctions describe-execution \
              --execution-arn "$EXECUTION_ARN" \
              --output json)
            STATUS=$(echo "$RESULT" | jq -r '.status')
            echo "[${ELAPSED}s] status=$STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              OUTPUT_RAW=$(echo "$RESULT" | jq -r '.output // "{}"')
              OUTPUT=$(echo "$OUTPUT_RAW" | jq . 2>/dev/null || echo "$OUTPUT_RAW")
              {
                echo "## Lobbying index reindex"
                echo ""
                echo "- Environment: \`$ENVIRONMENT\`"
                echo "- Execution ARN: \`$EXECUTION_ARN\`"
                echo "- Status: **SUCCEEDED**"
                echo ""
                echo "### Output"
                echo '```json'
                echo "$OUTPUT"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "TIMED_OUT" ] || [ "$STATUS" = "ABORTED" ]; then
              ERROR=$(echo "$RESULT" | jq -r '.error // "unknown"')
              CAUSE_RAW=$(echo "$RESULT" | jq -r '.cause // ""')
              CAUSE=$(echo "$CAUSE_RAW" | jq . 2>/dev/null || echo "$CAUSE_RAW")
              {
                echo "## Lobbying index reindex — $STATUS"
                echo ""
                echo "- Environment: \`$ENVIRONMENT\`"
                echo "- Execution ARN: \`$EXECUTION_ARN\`"
                echo "- Status: **$STATUS**"
                echo "- Error: \`$ERROR\`"
                echo ""
                echo "### Cause"
                echo '```'
                echo "$CAUSE"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          {
            echo "## Lobbying index reindex — poller ceiling exceeded"
            echo ""
            echo "- Environment: \`$ENVIRONMENT\`"
            echo "- Execution ARN: \`$EXECUTION_ARN\`"
            echo "- Poller exceeded ceiling of ${MAX_WAIT}s without a terminal state"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
