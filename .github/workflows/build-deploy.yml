name: Build and Deploy to App Store Connect

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for this build (optional)'
        required: false
        type: string

concurrency:
  group: app-store-deploy
  cancel-in-progress: false   # never cancel a deploy mid-flight

jobs:
  deploy:
    name: Archive, sign, and upload to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin Xcode. Update this when the project requires a newer release.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Cache resolved SPM packages so dependency resolution is skipped on
      # cache hits. Key changes whenever Package.resolved changes.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/epac.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Install fastlane via Bundler. `bundler-cache: true` caches gems
      # between runs using the Gemfile.lock as the cache key.
      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      # Write the .p8 file to the standard location xcodebuild and fastlane
      # both look for API keys. The filename must match AuthKey_<keyID>.p8.
      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY }}" \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      # Create a short-lived keychain isolated from the user's login keychain.
      - name: Create ephemeral keychain
        run: |
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

      # Import the distribution certificate from a GitHub secret.
      #
      # Why: Apple caps distribution certificates at 2 per account. Letting
      # xcodebuild or the ASC API create a new cert on every CI run exhausts
      # this limit within days (error: "Choose a certificate to revoke").
      # The fix is to export the existing cert+key as a .p12 from Keychain
      # Access on a developer machine, base64-encode it, and store it as the
      # DISTRIBUTION_CERT_P12 secret. CI then installs this one cert each
      # run instead of creating new ones.
      #
      # Setup (one-time):
      #   1. Open Keychain Access → My Certificates
      #   2. Right-click "Apple Distribution: ..." → Export → save as .p12
      #   3. base64 -i DistributionCert.p12 | pbcopy
      #   4. Add GitHub secret DISTRIBUTION_CERT_P12 = (clipboard)
      #   5. Add GitHub secret DISTRIBUTION_CERT_PASSWORD = (the .p12 password)
      #
      # This step is skipped when the secret is absent (first-time setup or
      # secret rotation). Without it, signing falls back to xcodebuild
      # automatic provisioning, which will fail if the cert limit is exhausted.
      - name: Import distribution certificate
        env:
          DIST_CERT_P12: ${{ secrets.DISTRIBUTION_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DISTRIBUTION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Skip gracefully when the secret has not been configured yet.
          # See the comment above for setup instructions.
          if [ -z "$DIST_CERT_P12" ]; then
            echo "⚠️  DISTRIBUTION_CERT_P12 secret is not set — skipping cert import."
            echo "    Without it, xcodebuild may hit the 2-cert account limit."
            echo "    See .github/workflows/build-deploy.yml for one-time setup steps."
            exit 0
          fi
          echo "$DIST_CERT_P12" | base64 --decode > /tmp/dist_cert.p12
          security import /tmp/dist_cert.p12 \
            -k ~/Library/Keychains/build.keychain \
            -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" \
            ~/Library/Keychains/build.keychain
          rm /tmp/dist_cert.p12

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bundle exec fastlane deploy

      - name: Delete ephemeral keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true
