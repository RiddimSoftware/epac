name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (patch / minor / major)'
        required: false
        type: choice
        default: patch
        options: [patch, minor, major]
      dry_run:
        description: Skip signing, archive, upload, and draft release creation
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  call:
    # GitHub requires a static reusable-workflow ref here. epac pins the
    # matching inner riddim-release checkout with repo variable RIDDIM_RELEASE_REF.
    uses: RiddimSoftware/riddim-release/.github/workflows/build-deploy.yml@main
    with:
      apple_app_id:        ${{ vars.APPLE_APP_ID }}
      bundle_id:           ${{ vars.BUNDLE_ID }}
      team_id:             ${{ vars.TEAM_ID }}
      scheme:              ${{ vars.SCHEME }}
      xcodeproj_path:      ${{ vars.XCODEPROJ_PATH }}
      ios_workdir:         ${{ vars.IOS_WORKDIR || 'ios' }}
      primary_locale:      ${{ vars.PRIMARY_LOCALE || 'en-CA' }}
      dry_run:             ${{ inputs.dry_run }}
      extra_bundle_ids:    ${{ vars.EXTRA_BUNDLE_IDS || '' }}
      runner_labels_mac:   ${{ vars.RUNNER_LABELS_MAC || '["macos-15"]' }}
      runner_labels_linux: ${{ vars.RUNNER_LABELS_LINUX || '["ubuntu-latest"]' }}
      has_app_clip:        true
    secrets: inherit
