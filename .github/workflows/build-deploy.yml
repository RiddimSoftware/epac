name: Build and Deploy to App Store Connect

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: app-store-deploy
  cancel-in-progress: false   # never cancel a deploy mid-flight

jobs:
  deploy:
    name: Archive, sign, and upload to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin Xcode. Update this when the project requires a newer release.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Cache resolved SPM packages so dependency resolution is skipped on
      # cache hits. Key changes whenever Package.resolved changes.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/epac.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Install fastlane via Bundler. `bundler-cache: true` caches gems
      # between runs using the Gemfile.lock as the cache key.
      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      # Write the .p8 file to the standard location xcodebuild and fastlane
      # both look for API keys. The filename must match AuthKey_<keyID>.p8.
      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY }}" \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      # Create a short-lived keychain isolated from the user's login keychain.
      # Xcode uses it to store the distribution certificate it downloads via
      # the ASC API. The keychain is deleted in the cleanup step regardless of
      # job outcome.
      - name: Create ephemeral keychain
        run: |
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bundle exec fastlane deploy

      - name: Delete ephemeral keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true
