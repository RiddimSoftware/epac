name: Promote Backend Production

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Backend service to deploy, or all'
        required: true
        default: all
        type: choice
        options:
          - all
          - daily-fetch
          - loader
          - members
          - sittings
          - bills
          - search
          - member-speeches
          - member-votes
          - on-this-day
          - estimates
          - riding-boundary
          - calendar
          - config
          - health
          - device-register
          - openapi
          - live-status

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ matrix.service }} to production
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [daily-fetch, loader, search, members, sittings, bills, member-speeches, member-votes, on-this-day, estimates, riding-boundary, calendar, config, health, device-register, openapi, live-status]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/${{ matrix.service }}/go.mod

      - name: Configure AWS credentials
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_PRODUCTION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Test and package Lambda
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        working-directory: backend
        run: make test package SERVICE=${{ matrix.service }}

      - name: Update production Lambda
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        working-directory: backend/${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
          CANONICAL_FUNCTION_NAME: epac-${{ matrix.service }}-production
          LEGACY_FUNCTION_NAME: ${{ matrix.service }}
        run: |
          set -euo pipefail
          FUNCTION_NAME="$CANONICAL_FUNCTION_NAME"
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            FUNCTION_NAME="$LEGACY_FUNCTION_NAME"
          fi
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            if [[ " members sittings bills estimates calendar config " == *" $SERVICE "* ]]; then
              echo "$CANONICAL_FUNCTION_NAME does not exist yet; apply infra/terraform/production before deploying this new artifact-backed Lambda."
              exit 0
            fi
          fi
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://function.zip
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

      - name: Sync production DATABASE_URL from Secrets Manager
        if: ${{ (inputs.service == 'all' || inputs.service == matrix.service) && contains(fromJSON('["daily-fetch","loader","search","health","device-register","live-status"]'), matrix.service) }}
        env:
          CANONICAL_FUNCTION_NAME: epac-${{ matrix.service }}-production
          LEGACY_FUNCTION_NAME: ${{ matrix.service }}
          DATABASE_URL_SECRET_ID: epac/database-url
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_PRODUCTION }}
        run: |
          set -euo pipefail

          FUNCTION_NAME="$CANONICAL_FUNCTION_NAME"
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            FUNCTION_NAME="$LEGACY_FUNCTION_NAME"
          fi

          DATABASE_URL=$(aws secretsmanager get-secret-value \
            --secret-id "$DATABASE_URL_SECRET_ID" \
            --query SecretString \
            --output text)
          if printf '%s' "$DATABASE_URL" | jq -e 'type == "object" and has("DATABASE_URL")' >/dev/null 2>&1; then
            DATABASE_URL=$(printf '%s' "$DATABASE_URL" | jq -r '.DATABASE_URL')
          fi
          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "None" ]; then
            echo "Secret ${DATABASE_URL_SECRET_ID} did not contain a DATABASE_URL value"
            exit 1
          fi

          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json)
          UPDATED_ENV=$(jq -cn \
            --argjson current "${CURRENT_ENV:-null}" \
            --arg database_url "$DATABASE_URL" \
            --arg sentry_dsn "$SENTRY_DSN" \
            '{Variables: (($current // {}) + {DATABASE_URL: $database_url} + (if $sentry_dsn != "" then {SENTRY_DSN: $sentry_dsn} else {} end))}')

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "$UPDATED_ENV" \
            >/dev/null
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

      - name: Sync production artifact environment
        if: ${{ (inputs.service == 'all' || inputs.service == matrix.service) && contains(fromJSON('["members","sittings","bills","member-speeches","member-votes","on-this-day","estimates","riding-boundary","calendar","config"]'), matrix.service) }}
        env:
          CANONICAL_FUNCTION_NAME: epac-${{ matrix.service }}-production
          LEGACY_FUNCTION_NAME: ${{ matrix.service }}
          ARTIFACT_BUCKET: ${{ vars.EPAC_ARTIFACT_BUCKET_PRODUCTION || vars.EPAC_ARTIFACT_BUCKET || vars.ARTIFACTS_BUCKET }}
          ARTIFACT_PREFIX: ${{ vars.EPAC_ARTIFACT_PREFIX_PRODUCTION || vars.EPAC_ARTIFACT_PREFIX }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_PRODUCTION }}
        run: |
          set -euo pipefail

          FUNCTION_NAME="$CANONICAL_FUNCTION_NAME"
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            FUNCTION_NAME="$LEGACY_FUNCTION_NAME"
          fi
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "$CANONICAL_FUNCTION_NAME does not exist yet; skipping artifact environment sync until Terraform creates it."
            exit 0
          fi

          if [ -z "$ARTIFACT_BUCKET" ]; then
            echo "EPAC_ARTIFACT_BUCKET_PRODUCTION, EPAC_ARTIFACT_BUCKET, or ARTIFACTS_BUCKET variable is required"
            exit 1
          fi

          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json)
          UPDATED_ENV=$(jq -cn \
            --argjson current "${CURRENT_ENV:-null}" \
            --arg artifact_bucket "$ARTIFACT_BUCKET" \
            --arg artifact_prefix "$ARTIFACT_PREFIX" \
            --arg sentry_dsn "$SENTRY_DSN" \
            '{Variables: ((($current // {}) | del(.DATABASE_URL)) + {EPAC_ARTIFACT_BUCKET: $artifact_bucket} + (if $artifact_prefix != "" then {EPAC_ARTIFACT_PREFIX: $artifact_prefix} else {} end) + (if $sentry_dsn != "" then {SENTRY_DSN: $sentry_dsn} else {} end))}')

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "$UPDATED_ENV" \
            >/dev/null
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

      - name: Ensure search speeches route
        if: ${{ (inputs.service == 'all' || inputs.service == matrix.service) && matrix.service == 'search' }}
        env:
          API_NAME: epac-api-api
          CANONICAL_FUNCTION_NAME: epac-search-production
          LEGACY_FUNCTION_NAME: search
          ROUTE_KEY: GET /search/speeches
          STATEMENT_ID: apigateway-search-speeches-production
        run: |
          set -euo pipefail
          API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='${API_NAME}'].ApiId | [0]" \
            --output text)
          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            echo "API ${API_NAME} not found"
            exit 1
          fi

          FUNCTION_NAME="$CANONICAL_FUNCTION_NAME"
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            FUNCTION_NAME="$LEGACY_FUNCTION_NAME"
          fi

          LAMBDA_ARN=$(aws lambda get-function \
            --function-name "$FUNCTION_NAME" \
            --query 'Configuration.FunctionArn' \
            --output text)
          INTEGRATION_ID=$(aws apigatewayv2 get-integrations \
            --api-id "$API_ID" \
            --query "Items[?IntegrationUri=='${LAMBDA_ARN}'].IntegrationId | [0]" \
            --output text)
          if [ -z "$INTEGRATION_ID" ] || [ "$INTEGRATION_ID" = "None" ]; then
            INTEGRATION_ID=$(aws apigatewayv2 create-integration \
              --api-id "$API_ID" \
              --integration-type AWS_PROXY \
              --integration-uri "$LAMBDA_ARN" \
              --payload-format-version 2.0 \
              --query 'IntegrationId' \
              --output text)
          fi

          ROUTE_ID=$(aws apigatewayv2 get-routes \
            --api-id "$API_ID" \
            --query "Items[?RouteKey=='${ROUTE_KEY}'].RouteId | [0]" \
            --output text)
          if [ -z "$ROUTE_ID" ] || [ "$ROUTE_ID" = "None" ]; then
            aws apigatewayv2 create-route \
              --api-id "$API_ID" \
              --route-key "$ROUTE_KEY" \
              --target "integrations/${INTEGRATION_ID}" >/dev/null
          else
            aws apigatewayv2 update-route \
              --api-id "$API_ID" \
              --route-id "$ROUTE_ID" \
              --target "integrations/${INTEGRATION_ID}" >/dev/null
          fi

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${AWS_REGION:-us-east-1}"
          aws lambda add-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id "$STATEMENT_ID" \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:${REGION}:${ACCOUNT_ID}:${API_ID}/*/*/search/speeches" \
            >/dev/null 2>&1 || true
          aws apigatewayv2 create-deployment --api-id "$API_ID" --stage-name production >/dev/null
