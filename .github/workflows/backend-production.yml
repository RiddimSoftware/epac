name: Promote Backend Production

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Backend service to deploy, or all'
        required: true
        default: all
        type: choice
        options:
          - all
          - daily-fetch
          - loader
          - members
          - sittings
          - bills
          - member-speeches
          - member-votes
          - on-this-day
          - estimates
          - riding-boundary
          - calendar
          - config
          - health
          - openapi

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ matrix.service }} to production
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [daily-fetch, loader, members, sittings, bills, member-speeches, member-votes, on-this-day, estimates, riding-boundary, calendar, config, health, openapi]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/${{ matrix.service }}/go.mod

      - name: Configure AWS credentials
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_PRODUCTION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Test and package Lambda
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        working-directory: backend
        run: make test package SERVICE=${{ matrix.service }}

      - name: Update production Lambda
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        working-directory: backend/${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
          CANONICAL_FUNCTION_NAME: epac-${{ matrix.service }}-production
          LEGACY_FUNCTION_NAME: ${{ matrix.service }}
        run: |
          set -euo pipefail
          FUNCTION_NAME="$CANONICAL_FUNCTION_NAME"
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            FUNCTION_NAME="$LEGACY_FUNCTION_NAME"
          fi
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            if [[ " members sittings bills estimates calendar config " == *" $SERVICE "* ]]; then
              echo "$CANONICAL_FUNCTION_NAME does not exist yet; apply infra/terraform/production before deploying this new artifact-backed Lambda."
              exit 0
            fi
          fi
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://function.zip
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

      - name: Sync production DATABASE_URL from Secrets Manager
        if: ${{ (inputs.service == 'all' || inputs.service == matrix.service) && contains(fromJSON('["daily-fetch","loader","health"]'), matrix.service) }}
        env:
          CANONICAL_FUNCTION_NAME: epac-${{ matrix.service }}-production
          LEGACY_FUNCTION_NAME: ${{ matrix.service }}
          DATABASE_URL_SECRET_ID: epac/database-url
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_PRODUCTION }}
        run: |
          set -euo pipefail

          FUNCTION_NAME="$CANONICAL_FUNCTION_NAME"
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            FUNCTION_NAME="$LEGACY_FUNCTION_NAME"
          fi

          DATABASE_URL=$(aws secretsmanager get-secret-value \
            --secret-id "$DATABASE_URL_SECRET_ID" \
            --query SecretString \
            --output text)
          if printf '%s' "$DATABASE_URL" | jq -e 'type == "object" and has("DATABASE_URL")' >/dev/null 2>&1; then
            DATABASE_URL=$(printf '%s' "$DATABASE_URL" | jq -r '.DATABASE_URL')
          fi
          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "None" ]; then
            echo "Secret ${DATABASE_URL_SECRET_ID} did not contain a DATABASE_URL value"
            exit 1
          fi

          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json)
          UPDATED_ENV=$(jq -cn \
            --argjson current "${CURRENT_ENV:-null}" \
            --arg database_url "$DATABASE_URL" \
            --arg sentry_dsn "$SENTRY_DSN" \
            '{Variables: (($current // {}) + {DATABASE_URL: $database_url} + (if $sentry_dsn != "" then {SENTRY_DSN: $sentry_dsn} else {} end))}')

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "$UPDATED_ENV" \
            >/dev/null
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

      - name: Sync production artifact environment
        if: ${{ (inputs.service == 'all' || inputs.service == matrix.service) && contains(fromJSON('["members","sittings","bills","member-speeches","member-votes","on-this-day","estimates","riding-boundary","calendar","config"]'), matrix.service) }}
        env:
          CANONICAL_FUNCTION_NAME: epac-${{ matrix.service }}-production
          LEGACY_FUNCTION_NAME: ${{ matrix.service }}
          ARTIFACT_BUCKET: ${{ vars.EPAC_ARTIFACT_BUCKET_PRODUCTION || vars.EPAC_ARTIFACT_BUCKET || vars.ARTIFACTS_BUCKET }}
          ARTIFACT_PREFIX: ${{ vars.EPAC_ARTIFACT_PREFIX_PRODUCTION || vars.EPAC_ARTIFACT_PREFIX }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_PRODUCTION }}
        run: |
          set -euo pipefail

          FUNCTION_NAME="$CANONICAL_FUNCTION_NAME"
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            FUNCTION_NAME="$LEGACY_FUNCTION_NAME"
          fi
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "$CANONICAL_FUNCTION_NAME does not exist yet; skipping artifact environment sync until Terraform creates it."
            exit 0
          fi

          if [ -z "$ARTIFACT_BUCKET" ]; then
            echo "EPAC_ARTIFACT_BUCKET_PRODUCTION, EPAC_ARTIFACT_BUCKET, or ARTIFACTS_BUCKET variable is required"
            exit 1
          fi

          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json)
          UPDATED_ENV=$(jq -cn \
            --argjson current "${CURRENT_ENV:-null}" \
            --arg artifact_bucket "$ARTIFACT_BUCKET" \
            --arg artifact_prefix "$ARTIFACT_PREFIX" \
            --arg sentry_dsn "$SENTRY_DSN" \
            '{Variables: ((($current // {}) | del(.DATABASE_URL)) + {EPAC_ARTIFACT_BUCKET: $artifact_bucket} + (if $artifact_prefix != "" then {EPAC_ARTIFACT_PREFIX: $artifact_prefix} else {} end) + (if $sentry_dsn != "" then {SENTRY_DSN: $sentry_dsn} else {} end))}')

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "$UPDATED_ENV" \
            >/dev/null
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"
