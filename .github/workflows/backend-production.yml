name: Promote Backend Production

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Backend service to deploy, or all'
        required: true
        default: all
        type: string

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  infra-apply:
    name: Apply production Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.3"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_PRODUCTION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Bootstrap production Terraform backend
        run: bash infra/terraform/bootstrap.sh production

      - name: Terraform init
        working-directory: infra/terraform/production
        run: terraform init -input=false -no-color

      - name: Terraform plan
        working-directory: infra/terraform/production
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee tfplan.txt

      - name: Add plan to workflow summary
        working-directory: infra/terraform/production
        run: |
          {
            echo "## Production Terraform plan"
            echo
            echo '```terraform'
            cat tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        working-directory: infra/terraform/production
        run: terraform apply -input=false -auto-approve -no-color tfplan

  prepare:
    name: Resolve backend service manifest
    needs: infra-apply
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.resolve.outputs.services }}
      database_services: ${{ steps.resolve.outputs.database_services }}
      artifact_services: ${{ steps.resolve.outputs.artifact_services }}
      service_is_valid: ${{ steps.validate.outputs.service_is_valid }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          SERVICES=$(jq -c '[.services[] | select(.deploy.production == true) | .name]' backend/manifest/deployment-services.json)
          DATABASE_SERVICES=$(jq -c '[.services[] | select(.sync.production.database == true) | .name]' backend/manifest/deployment-services.json)
          ARTIFACT_SERVICES=$(jq -c '[.services[] | select(.sync.production.artifact == true) | .name]' backend/manifest/deployment-services.json)

          if [ "$SERVICES" = "[]" ]; then
            echo "No production services found in manifest" >&2
            exit 1
          fi

          {
            echo "services=$SERVICES"
            echo "database_services=$DATABASE_SERVICES"
            echo "artifact_services=$ARTIFACT_SERVICES"
          } >> "$GITHUB_OUTPUT"

      - id: validate
        run: |
          SERVICE='${{ inputs.service }}'
          if [ -z "$SERVICE" ]; then
            SERVICE=all
          fi
          if [ "$SERVICE" = "all" ]; then
            {
              echo "service_is_valid=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo '${{ steps.resolve.outputs.services }}' | jq -e --arg service "$SERVICE" 'index($service)' >/dev/null; then
            echo "service_is_valid=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "service_is_valid=false"
            } >> "$GITHUB_OUTPUT"
            echo "Service $SERVICE is not in manifest deploy.production" >&2
            exit 1
          fi

  deploy:
    name: Deploy ${{ matrix.service }} to production
    needs: prepare
    if: ${{ needs.prepare.outputs.service_is_valid == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/${{ matrix.service }}/go.mod

      - name: Configure AWS credentials
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_PRODUCTION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Test and package Lambda
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        working-directory: backend
        run: make test package SERVICE=${{ matrix.service }}

      - name: Update production Lambda
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        working-directory: backend/${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
          CANONICAL_FUNCTION_NAME: epac-${{ matrix.service }}-production
          LEGACY_FUNCTION_NAME: ${{ matrix.service }}
        run: |
          set -euo pipefail
          FUNCTION_NAME="$CANONICAL_FUNCTION_NAME"
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            FUNCTION_NAME="$LEGACY_FUNCTION_NAME"
          fi

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://function.zip
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

      - name: Sync production DATABASE_URL from Secrets Manager
        if: ${{ (inputs.service == 'all' || inputs.service == matrix.service) && contains(fromJson(needs.prepare.outputs.database_services), matrix.service) }}
        env:
          CANONICAL_FUNCTION_NAME: epac-${{ matrix.service }}-production
          LEGACY_FUNCTION_NAME: ${{ matrix.service }}
          DATABASE_URL_SECRET_ID: epac/database-url
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_PRODUCTION }}
        run: |
          set -euo pipefail

          FUNCTION_NAME="$CANONICAL_FUNCTION_NAME"
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            FUNCTION_NAME="$LEGACY_FUNCTION_NAME"
          fi

          DATABASE_URL=$(aws secretsmanager get-secret-value \
            --secret-id "$DATABASE_URL_SECRET_ID" \
            --query SecretString \
            --output text)
          if printf '%s' "$DATABASE_URL" | jq -e 'type == "object" and has("DATABASE_URL")' >/dev/null 2>&1; then
            DATABASE_URL=$(printf '%s' "$DATABASE_URL" | jq -r '.DATABASE_URL')
          fi
          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "None" ]; then
            echo "Secret ${DATABASE_URL_SECRET_ID} did not contain a DATABASE_URL value"
            exit 1
          fi

          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json)
          UPDATED_ENV=$(jq -cn \
            --argjson current "${CURRENT_ENV:-null}" \
            --arg database_url "$DATABASE_URL" \
            --arg sentry_dsn "$SENTRY_DSN" \
            '{Variables: (($current // {}) + {DATABASE_URL: $database_url} + (if $sentry_dsn != "" then {SENTRY_DSN: $sentry_dsn} else {} end))}')

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "$UPDATED_ENV" \
            >/dev/null
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

      - name: Sync production artifact environment
        if: ${{ (inputs.service == 'all' || inputs.service == matrix.service) && contains(fromJson(needs.prepare.outputs.artifact_services), matrix.service) }}
        env:
          SERVICE: ${{ matrix.service }}
          CANONICAL_FUNCTION_NAME: epac-${{ matrix.service }}-production
          LEGACY_FUNCTION_NAME: ${{ matrix.service }}
          ARTIFACT_BUCKET: ${{ vars.EPAC_ARTIFACT_BUCKET_PRODUCTION || vars.EPAC_ARTIFACT_BUCKET || vars.ARTIFACTS_BUCKET }}
          ARTIFACT_PREFIX: ${{ vars.EPAC_ARTIFACT_PREFIX_PRODUCTION || vars.EPAC_ARTIFACT_PREFIX }}
          HANSARD_SEARCH_PREFIX: ${{ vars.EPAC_HANSARD_SEARCH_PREFIX || 'hansard-search/v1' }}
          PARLIAMENT_NUMBER: ${{ vars.EPAC_HANSARD_PARLIAMENT_NUMBER || '45' }}
          SESSION_NUMBER: ${{ vars.EPAC_HANSARD_SESSION_NUMBER || '1' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_PRODUCTION }}
        run: |
          set -euo pipefail

          FUNCTION_NAME="$CANONICAL_FUNCTION_NAME"
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            FUNCTION_NAME="$LEGACY_FUNCTION_NAME"
          fi
          if [ -z "$ARTIFACT_BUCKET" ]; then
            echo "EPAC_ARTIFACT_BUCKET_PRODUCTION, EPAC_ARTIFACT_BUCKET, or ARTIFACTS_BUCKET variable is required"
            exit 1
          fi

          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json)
          UPDATED_ENV=$(jq -cn \
            --argjson current "${CURRENT_ENV:-null}" \
            --arg service "$SERVICE" \
            --arg artifact_bucket "$ARTIFACT_BUCKET" \
            --arg artifact_prefix "$ARTIFACT_PREFIX" \
            --arg hansard_search_prefix "$HANSARD_SEARCH_PREFIX" \
            --arg parliament_number "$PARLIAMENT_NUMBER" \
            --arg session_number "$SESSION_NUMBER" \
            --arg sentry_dsn "$SENTRY_DSN" \
            '{Variables: ((($current // {}) | del(.DATABASE_URL)) + {EPAC_ARTIFACT_BUCKET: $artifact_bucket} + (if $artifact_prefix != "" then {EPAC_ARTIFACT_PREFIX: $artifact_prefix} else {} end) + (if $service == "hansard-search-index" then {EPAC_HANSARD_SEARCH_PREFIX: $hansard_search_prefix, PARLIAMENT_NUMBER: $parliament_number, SESSION_NUMBER: $session_number} else {} end) + (if $sentry_dsn != "" then {SENTRY_DSN: $sentry_dsn} else {} end))}')

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "$UPDATED_ENV" \
            >/dev/null
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"
