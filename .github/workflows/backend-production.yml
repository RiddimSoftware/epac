name: Promote Backend Production

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Backend service to deploy, or all'
        required: true
        default: all
        type: string

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Resolve backend service manifest
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.resolve.outputs.services }}
      artifact_services: ${{ steps.resolve.outputs.artifact_services }}
      service_is_valid: ${{ steps.validate.outputs.service_is_valid }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          SERVICES=$(jq -c '[.services[] | select(.deploy.production == true) | .name]' backend/manifest/deployment-services.json)
          ARTIFACT_SERVICES=$(jq -c '[.services[] | select(.sync.production.artifact == true) | .name]' backend/manifest/deployment-services.json)

          if [ "$SERVICES" = "[]" ]; then
            echo "No production services found in manifest" >&2
            exit 1
          fi

          {
            echo "services=$SERVICES"
            echo "artifact_services=$ARTIFACT_SERVICES"
          } >> "$GITHUB_OUTPUT"

      - id: validate
        run: |
          SERVICE='${{ inputs.service }}'
          if [ -z "$SERVICE" ]; then
            SERVICE=all
          fi
          if [ "$SERVICE" = "all" ]; then
            {
              echo "service_is_valid=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo '${{ steps.resolve.outputs.services }}' | jq -e --arg service "$SERVICE" 'index($service)' >/dev/null; then
            echo "service_is_valid=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "service_is_valid=false"
            } >> "$GITHUB_OUTPUT"
            echo "Service $SERVICE is not in manifest deploy.production" >&2
            exit 1
          fi

  provision-search:
    name: Provision production search Lambdas and API route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_PRODUCTION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Provision search Lambdas and API Gateway route
        env:
          LAMBDA_ROLE: arn:aws:iam::227530433709:role/epac-lambda-role
          API_ID: bdnpz6v3c8
          ACCOUNT_ID: '227530433709'
        run: |
          set -euo pipefail

          {
            echo "## Provision production search resources"
            echo ""
            echo "| Resource | Outcome |"
            echo "|----------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"

          # --- epac-hansard-search-index-production Lambda ---
          if ! aws lambda get-function --function-name epac-hansard-search-index-production > /dev/null 2>&1; then
            aws lambda create-function \
              --function-name epac-hansard-search-index-production \
              --runtime provided.al2023 \
              --handler bootstrap \
              --architectures arm64 \
              --role "$LAMBDA_ROLE" \
              --zip-file fileb://infra/placeholder.zip \
              --timeout 900 \
              --memory-size 1024
            aws lambda wait function-active-v2 --function-name epac-hansard-search-index-production
            echo "| epac-hansard-search-index-production | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            aws lambda update-function-configuration \
              --function-name epac-hansard-search-index-production \
              --timeout 900 \
              --memory-size 1024 \
              >/dev/null
            aws lambda wait function-updated --function-name epac-hansard-search-index-production
            echo "| epac-hansard-search-index-production | already existed, config ensured |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- epac-hansard-search-production Lambda ---
          if ! aws lambda get-function --function-name epac-hansard-search-production > /dev/null 2>&1; then
            aws lambda create-function \
              --function-name epac-hansard-search-production \
              --runtime provided.al2023 \
              --handler bootstrap \
              --architectures arm64 \
              --role "$LAMBDA_ROLE" \
              --zip-file fileb://infra/placeholder.zip \
              --timeout 30 \
              --memory-size 128
            aws lambda wait function-active-v2 --function-name epac-hansard-search-production
            echo "| epac-hansard-search-production | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            aws lambda update-function-configuration \
              --function-name epac-hansard-search-production \
              --timeout 30 \
              >/dev/null
            aws lambda wait function-updated --function-name epac-hansard-search-production
            echo "| epac-hansard-search-production | already existed, config ensured |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- API Gateway integration ---
          EXISTING_INTEGRATION_ID=$(aws apigatewayv2 get-integrations --api-id "$API_ID" \
            --query "Items[?IntegrationUri=='arn:aws:lambda:us-east-1:${ACCOUNT_ID}:function:epac-hansard-search-production'].IntegrationId | [0]" \
            --output text)
          if [ "$EXISTING_INTEGRATION_ID" = "None" ] || [ -z "$EXISTING_INTEGRATION_ID" ]; then
            INTEGRATION_ID=$(aws apigatewayv2 create-integration \
              --api-id "$API_ID" \
              --integration-type AWS_PROXY \
              --integration-uri "arn:aws:lambda:us-east-1:${ACCOUNT_ID}:function:epac-hansard-search-production" \
              --payload-format-version 2.0 \
              --query IntegrationId --output text)
            echo "| API Gateway integration | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            INTEGRATION_ID="$EXISTING_INTEGRATION_ID"
            echo "| API Gateway integration | already existed, skipped |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- API Gateway route ---
          ROUTE_ID=$(aws apigatewayv2 get-routes --api-id "$API_ID" \
            --query "Items[?RouteKey=='GET /api/v1/hansard/search'].RouteId | [0]" \
            --output text)
          if [ "$ROUTE_ID" = "None" ] || [ -z "$ROUTE_ID" ]; then
            aws apigatewayv2 create-route \
              --api-id "$API_ID" \
              --route-key "GET /api/v1/hansard/search" \
              --target "integrations/${INTEGRATION_ID}"
            echo "| GET /api/v1/hansard/search route | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| GET /api/v1/hansard/search route | already existed, skipped |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- Lambda permission ---
          aws lambda add-permission \
            --function-name epac-hansard-search-production \
            --statement-id apigw-invoke-hansard-search \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:us-east-1:${ACCOUNT_ID}:${API_ID}/*/GET/api/v1/hansard/search" \
            2>/dev/null || true
          echo "| Lambda permission (apigw-invoke-hansard-search) | ensured |" >> "$GITHUB_STEP_SUMMARY"

  provision-lobbying-index:
    name: Provision production lobbying-index Lambda and state machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_PRODUCTION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Provision lobbying-index Lambda
        env:
          LOBBYING_INDEX_FUNCTION_NAME: epac-lobbying-index-production
          LOBBYING_INDEX_STATE_MACHINE_NAME: epac-lobbying-index-production
          LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME: epac-lobbying-index-production-state-machine-role
          LAMBDA_ROLE: arn:aws:iam::227530433709:role/epac-lambda-role
          ACCOUNT_ID: '227530433709'
        run: |
          set -euo pipefail

          LOBBYING_INDEX_LAMBDA_ARN="arn:aws:lambda:us-east-1:${ACCOUNT_ID}:function:${LOBBYING_INDEX_FUNCTION_NAME}"
          STATE_MACHINE_ARN="arn:aws:states:us-east-1:${ACCOUNT_ID}:stateMachine:${LOBBYING_INDEX_STATE_MACHINE_NAME}"
          STATE_MACHINE_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME}"

          {
            echo "## Provision production lobbying-index resources"
            echo ""
            echo "| Resource | Outcome |"
            echo "|----------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"

          # --- epac-lobbying-index-production Lambda ---
          echo "Ensuring ${LOBBYING_INDEX_FUNCTION_NAME} Lambda has 900 s timeout and 2048 MB ephemeral storage"
          if ! aws lambda get-function --function-name "$LOBBYING_INDEX_FUNCTION_NAME" > /dev/null 2>&1; then
            aws lambda create-function \
              --function-name "$LOBBYING_INDEX_FUNCTION_NAME" \
              --runtime provided.al2023 \
              --handler bootstrap \
              --architectures arm64 \
              --role "$LAMBDA_ROLE" \
              --zip-file fileb://infra/placeholder.zip \
              --timeout 900 \
              --memory-size 1024 \
              --ephemeral-storage '{"Size":2048}'
            aws lambda wait function-active-v2 --function-name "$LOBBYING_INDEX_FUNCTION_NAME"
            echo "| ${LOBBYING_INDEX_FUNCTION_NAME} Lambda | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            aws lambda update-function-configuration \
              --function-name "$LOBBYING_INDEX_FUNCTION_NAME" \
              --timeout 900 \
              --memory-size 1024 \
              --ephemeral-storage '{"Size":2048}' \
              >/dev/null
            aws lambda wait function-updated --function-name "$LOBBYING_INDEX_FUNCTION_NAME"
            echo "| ${LOBBYING_INDEX_FUNCTION_NAME} Lambda | already existed, config ensured |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- Step Functions execution role (states.amazonaws.com -> Lambda invoke) ---
          echo "Ensuring ${LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME} can be assumed by Step Functions and invoke the Lambda"
          TRUST_POLICY=$(jq -cn '{
            Version: "2012-10-17",
            Statement: [
              {
                Effect: "Allow",
                Principal: {Service: "states.amazonaws.com"},
                Action: "sts:AssumeRole"
              }
            ]
          }')
          INVOKE_POLICY=$(jq -cn --arg lambda_arn "$LOBBYING_INDEX_LAMBDA_ARN" '{
            Version: "2012-10-17",
            Statement: [
              {
                Sid: "InvokeLobbyingIndexLambda",
                Effect: "Allow",
                Action: "lambda:InvokeFunction",
                Resource: [$lambda_arn, ($lambda_arn + ":*")]
              }
            ]
          }')

          if ! aws iam get-role --role-name "$LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME" > /dev/null 2>&1; then
            aws iam create-role \
              --role-name "$LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME" \
              --assume-role-policy-document "$TRUST_POLICY" \
              >/dev/null
            aws iam wait role-exists --role-name "$LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME"
            echo "| ${LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME} | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            aws iam update-assume-role-policy \
              --role-name "$LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME" \
              --policy-document "$TRUST_POLICY" \
              >/dev/null
            echo "| ${LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME} | already existed, trust ensured |" >> "$GITHUB_STEP_SUMMARY"
          fi

          aws iam put-role-policy \
            --role-name "$LOBBYING_INDEX_STATE_MACHINE_ROLE_NAME" \
            --policy-name EpacLobbyingIndexInvokeLambda \
            --policy-document "$INVOKE_POLICY" \
            >/dev/null
          echo "| Step Functions Lambda invoke policy | ensured |" >> "$GITHUB_STEP_SUMMARY"

          # IAM role/policy propagation is eventually consistent.
          echo "Waiting 10 s for IAM role and policy propagation"
          sleep 10

          echo "Rendering infra/lobbying-index.asl.json for ${LOBBYING_INDEX_LAMBDA_ARN}"
          STATE_MACHINE_DEFINITION=$(jq -c \
            --arg lambda_arn "$LOBBYING_INDEX_LAMBDA_ARN" \
            '(.States[] | select(.Type == "Task") | .Parameters.FunctionName) = $lambda_arn' \
            infra/lobbying-index.asl.json)

          # --- epac-lobbying-index-production Step Functions state machine ---
          echo "Ensuring ${LOBBYING_INDEX_STATE_MACHINE_NAME} Step Functions state machine exists"
          if ! aws stepfunctions describe-state-machine --state-machine-arn "$STATE_MACHINE_ARN" > /dev/null 2>&1; then
            aws stepfunctions create-state-machine \
              --name "$LOBBYING_INDEX_STATE_MACHINE_NAME" \
              --definition "$STATE_MACHINE_DEFINITION" \
              --role-arn "$STATE_MACHINE_ROLE_ARN" \
              --type STANDARD \
              >/dev/null
            echo "| ${LOBBYING_INDEX_STATE_MACHINE_NAME} state machine | created |" >> "$GITHUB_STEP_SUMMARY"
          else
            aws stepfunctions update-state-machine \
              --state-machine-arn "$STATE_MACHINE_ARN" \
              --definition "$STATE_MACHINE_DEFINITION" \
              --role-arn "$STATE_MACHINE_ROLE_ARN" \
              >/dev/null
            echo "| ${LOBBYING_INDEX_STATE_MACHINE_NAME} state machine | updated |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "Provisioned production lobbying-index Lambda and Step Functions state machine"

  deploy:
    name: Promote ${{ matrix.service }} to production
    needs: [prepare, provision-search, provision-lobbying-index]
    if: ${{ needs.prepare.outputs.service_is_valid == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (staging — read artifact)
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch staging Lambda code URL
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        id: staging-code
        env:
          STAGING_FUNCTION_NAME: epac-${{ matrix.service }}-staging
        run: |
          set -euo pipefail
          CODE_URL=$(aws lambda get-function \
            --function-name "$STAGING_FUNCTION_NAME" \
            --query 'Code.Location' \
            --output text 2>/dev/null) || {
            echo "::error title=Staging Lambda not found::${STAGING_FUNCTION_NAME} does not exist. Deploy to staging first."
            exit 1
          }
          if [ -z "$CODE_URL" ] || [ "$CODE_URL" = "None" ]; then
            echo "::error title=Staging Lambda has no code::${STAGING_FUNCTION_NAME} exists but Code.Location is empty."
            exit 1
          fi
          echo "code_url=$CODE_URL" >> "$GITHUB_OUTPUT"

      - name: Download staging artifact
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        run: |
          curl -fsSL -o /tmp/function-${{ matrix.service }}.zip \
            "${{ steps.staging-code.outputs.code_url }}"

      - name: Configure AWS credentials (production — deploy)
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_PRODUCTION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Promote Lambda to production
        if: ${{ inputs.service == 'all' || inputs.service == matrix.service }}
        env:
          FUNCTION_NAME: epac-${{ matrix.service }}-production
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb:///tmp/function-${{ matrix.service }}.zip
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - name: Sync production artifact environment
        if: ${{ (inputs.service == 'all' || inputs.service == matrix.service) && contains(fromJson(needs.prepare.outputs.artifact_services), matrix.service) }}
        env:
          SERVICE: ${{ matrix.service }}
          FUNCTION_NAME: epac-${{ matrix.service }}-production
          ARTIFACT_BUCKET: ${{ vars.EPAC_ARTIFACT_BUCKET_PRODUCTION || vars.EPAC_ARTIFACT_BUCKET || vars.ARTIFACTS_BUCKET }}
          ARTIFACT_PREFIX: ${{ vars.EPAC_ARTIFACT_PREFIX_PRODUCTION || vars.EPAC_ARTIFACT_PREFIX }}
          HANSARD_SEARCH_PREFIX: ${{ vars.EPAC_HANSARD_SEARCH_PREFIX || 'hansard-search/v1' }}
          PARLIAMENT_NUMBER: ${{ vars.EPAC_HANSARD_PARLIAMENT_NUMBER || '45' }}
          SESSION_NUMBER: ${{ vars.EPAC_HANSARD_SESSION_NUMBER || '1' }}
          LOBBYING_INDEX_PREFIX: ${{ vars.EPAC_LOBBYING_INDEX_PREFIX || 'lobbying-index/v1' }}
        run: |
          set -euo pipefail
          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json)
          UPDATED_ENV=$(jq -cn \
            --argjson current "${CURRENT_ENV:-null}" \
            --arg service "$SERVICE" \
            --arg artifact_bucket "$ARTIFACT_BUCKET" \
            --arg artifact_prefix "$ARTIFACT_PREFIX" \
            --arg hansard_search_prefix "$HANSARD_SEARCH_PREFIX" \
            --arg parliament_number "$PARLIAMENT_NUMBER" \
            --arg session_number "$SESSION_NUMBER" \
            --arg lobbying_index_prefix "$LOBBYING_INDEX_PREFIX" \
            '{Variables: ((($current // {}) | del(.DATABASE_URL)) + {EPAC_ARTIFACT_BUCKET: $artifact_bucket} + (if $artifact_prefix != "" then {EPAC_ARTIFACT_PREFIX: $artifact_prefix} else {} end) + (if $service == "hansard-search-index" then {EPAC_HANSARD_SEARCH_PREFIX: $hansard_search_prefix, PARLIAMENT_NUMBER: $parliament_number, SESSION_NUMBER: $session_number} else {} end) + (if $service == "lobbying-index" or $service == "lobbying" then {LOBBYING_INDEX_PREFIX: $lobbying_index_prefix} else {} end))}')
          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "$UPDATED_ENV" \
            >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
