# Autonomous PR Loop — epac consumer trigger wrapper for RIDDIM-96.
#
# Shared implementation lives in RiddimSoftware/riddim-release reusable workflows.
# Keep this file thin: epac owns only event filtering, repo-local build/test inputs,
# and secret inheritance. Bot prompts, guards, and merge behavior stay centralized.
# Bot logins:
# - developer-bot opens implementation PRs.
# - riddim-reviewer-bot reviews developer-bot PRs and requests fix-ups.
#
# Ticket tracking is in Jira (project EPAC), not GitHub Issues.
# The entry point for a new PR is a Jira Automation rule that fires when the
# label 'agent:pr' is added to a ticket and POSTs a repository_dispatch event
# of type 'jira-ticket-ready' to this repo.
#
# Required org secrets with selected-repository access to epac:
# - CLAUDE_CODE_OAUTH_TOKEN
# - DEV_BOT_APP_ID
# - DEV_BOT_PRIVATE_KEY
# - REVIEWER_BOT_APP_ID
# - REVIEWER_BOT_PRIVATE_KEY
#
# Required labels on this repo:
# - autonomous    enrolled in automated review loop
# - agent:pause   suppresses reviewer/developer automation
# - agent:needs-human marks work that should stay with a person
# - agent:attempt-1, agent:attempt-2, agent:attempt-3 track retry budget
# - agent:rebase-attempt-1/-2/-3 track rebase retry budget
# - agent:rebase-failed marks a PR where all rebase attempts were exhausted
#
# Required branch protection on main:
# - require build/test/swiftlint checks
# - require reviewer-agent-passed
# - require stale-review dismissal and CODEOWNERS review

name: Autonomous PR Loop

on:
  repository_dispatch:
    types: [jira-ticket-ready]
  pull_request:
    types: [opened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: write
  issues: write

jobs:
  # ── Entry point: Jira ticket tagged agent:pr ─────────────────────────────
  # Triggered by Jira Automation via repository_dispatch when a ticket has a
  # branch ready and the 'agent:pr' label is applied in Jira.
  # Payload fields: jira_ticket, jira_summary, branch (optional), jira_url (optional)
  create-pr-from-jira:
    name: Create PR from Jira ticket
    if: github.event_name == 'repository_dispatch' && github.event.action == 'jira-ticket-ready'
    uses: RiddimSoftware/riddim-release/.github/workflows/create-pr.yml@main
    with:
      jira_ticket: ${{ github.event.client_payload.jira_ticket }}
      jira_summary: ${{ github.event.client_payload.jira_summary }}
      branch: ${{ github.event.client_payload.branch || '' }}
      jira_url: ${{ github.event.client_payload.jira_url || '' }}
    secrets:
      dev_bot_app_id: ${{ secrets.DEV_BOT_APP_ID }}
      dev_bot_private_key: ${{ secrets.DEV_BOT_PRIVATE_KEY }}

  # ── Fix-up: reviewer requested changes ───────────────────────────────────
  developer-fixup:
    name: Developer agent from reviewer changes requested
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      contains(github.event.review.user.login, 'riddim-reviewer-bot') &&
      !contains(github.event.pull_request.labels.*.name, 'agent:pause') &&
      !contains(github.event.pull_request.labels.*.name, 'agent:needs-human')
    uses: RiddimSoftware/riddim-release/.github/workflows/developer.yml@main
    with:
      trigger_type: changes_requested
      issue_number: ${{ github.event.pull_request.number }}
      pr_number: ${{ github.event.pull_request.number }}
      review_comments: ${{ github.event.review.body || '' }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      DEV_BOT_APP_ID: ${{ secrets.DEV_BOT_APP_ID }}
      DEV_BOT_PRIVATE_KEY: ${{ secrets.DEV_BOT_PRIVATE_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

  # ── Reviewer: runs when developer-bot opens or updates a PR ──────────────
  reviewer:
    name: Reviewer agent for developer PR
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'ready_for_review') &&
      contains(github.event.pull_request.user.login, 'riddim-developer-bot') &&
      !contains(github.event.sender.login, 'riddim-reviewer-bot') &&
      !contains(github.event.pull_request.labels.*.name, 'agent:pause') &&
      !contains(github.event.pull_request.labels.*.name, 'agent:needs-human')
    uses: RiddimSoftware/riddim-release/.github/workflows/reviewer.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REVIEWER_BOT_APP_ID: ${{ secrets.REVIEWER_BOT_APP_ID }}
      REVIEWER_BOT_PRIVATE_KEY: ${{ secrets.REVIEWER_BOT_PRIVATE_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

  # ── Rebase watcher: detects stale PRs on push / schedule ─────────────────
  rebase-watcher:
    name: Detect and route stale PRs for rebase
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: RiddimSoftware/riddim-release/.github/workflows/rebase-watcher.yml@main
    with:
      consumer_repo: ${{ github.repository }}
      # base_branch defaults to main
      # autonomous_label defaults to "autonomous"
    secrets:
      dev_bot_pat: ${{ secrets.DEV_BOT_PAT }}
