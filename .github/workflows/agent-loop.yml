# Autonomous agent trigger wrapper for RIDDIM-117.
#
# Bot logins:
# - developer-bot opens implementation PRs.
# - reviewer-bot reviews developer-bot PRs and requests fix-ups.
#
# Label vocabulary:
# - agent:build starts a developer run from a GitHub issue.
# - agent:pause suppresses reviewer/developer automation.
# - agent:needs-human marks work that should stay with a person.
# - agent:attempt-1, agent:attempt-2, agent:attempt-3 track retry budget.
#
# This consumer wrapper is intentionally thin. The shared implementation lives
# in RiddimSoftware/riddim-release reusable workflows.

name: Agent loop

on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  dev-on-issue-build:
    name: Developer agent from issue label
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'agent:build' &&
      !contains(github.event.issue.labels.*.name, 'agent:pause') &&
      !contains(github.event.issue.labels.*.name, 'agent:needs-human')
    uses: RiddimSoftware/riddim-release/.github/workflows/developer.yml@main
    with:
      trigger_type: issue_labeled
      issue_number: ${{ github.event.issue.number }}
      issue_body: ${{ github.event.issue.body || '' }}
    secrets: inherit

  dev-on-fixup:
    name: Developer agent from reviewer changes requested
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      contains(github.event.review.user.login, 'reviewer-bot') &&
      !contains(github.event.pull_request.labels.*.name, 'agent:pause') &&
      !contains(github.event.pull_request.labels.*.name, 'agent:needs-human')
    uses: RiddimSoftware/riddim-release/.github/workflows/developer.yml@main
    with:
      trigger_type: changes_requested
      pr_number: ${{ github.event.pull_request.number }}
      review_comments: ${{ github.event.review.body || '' }}
    secrets: inherit

  review-on-pr:
    name: Reviewer agent for developer PR
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.user.login, 'developer-bot') &&
      !contains(github.event.sender.login, 'reviewer-bot') &&
      !contains(github.event.pull_request.labels.*.name, 'agent:pause') &&
      !contains(github.event.pull_request.labels.*.name, 'agent:needs-human')
    uses: RiddimSoftware/riddim-release/.github/workflows/reviewer.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit
