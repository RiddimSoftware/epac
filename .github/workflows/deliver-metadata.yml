name: Deliver App Store Metadata

on:
  push:
    branches: [main]
    paths:
      - 'ios/fastlane/metadata/**'
      - 'ios/fastlane/Deliverfile'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  call:
    uses: RiddimSoftware/riddim-release/.github/workflows/deliver-metadata.yml@main
    with:
      ios_workdir:         ${{ vars.IOS_WORKDIR || 'ios' }}
      bundle_id:           ${{ vars.BUNDLE_ID }}
      team_id:             ${{ vars.TEAM_ID }}
      runner_labels_mac:   ${{ contains(fromJSON(vars.RUNNER_LABELS_MAC || '["macos-15"]'), 'self-hosted') && '["macos-15"]' || (vars.RUNNER_LABELS_MAC || '["macos-15"]') }}
      runner_labels_linux: ${{ contains(fromJSON(vars.RUNNER_LABELS_LINUX || '["ubuntu-latest"]'), 'self-hosted') && '["ubuntu-latest"]' || (vars.RUNNER_LABELS_LINUX || '["ubuntu-latest"]') }}
    secrets: inherit
