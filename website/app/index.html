<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-itunes-app" content="app-id=1224459142, app-argument=https://epac.riddimsoftware.com/app/?path=%2Fapp%2F">
  <title>Open in epac</title>
  <meta name="description" content="Open this epac web page in the epac iOS app, or download epac from the App Store.">
  <link rel="stylesheet" href="../default.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #111827;
    }
    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 72px 24px;
      text-align: center;
    }
    .app-card {
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 18px;
      background: #fff;
      padding: 32px 24px;
      box-shadow: 0 18px 42px rgba(15, 23, 42, .12);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.8rem;
      line-height: 1.15;
    }
    p {
      margin: 0 0 24px;
      color: #4b5563;
      line-height: 1.55;
    }
    a {
      color: inherit;
    }
    .primary-link {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 999px;
      background: #007aff;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    .secondary-link {
      display: block;
      margin-top: 16px;
      color: #4b5563;
      font-size: .92rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #09090b; color: #fff; }
      .app-card {
        border-color: rgba(255, 255, 255, .12);
        background: #18181b;
        box-shadow: 0 18px 42px rgba(0, 0, 0, .34);
      }
      p, .secondary-link { color: #cbd5e1; }
    }
  </style>
</head>
<body>
  <main>
    <section class="app-card" aria-labelledby="open-title">
      <h1 id="open-title">Open in epac</h1>
      <p>Opening the App Store if epac is not installed.</p>
      <a class="primary-link" id="app-store-link" href="https://apps.apple.com/ca/app/epac/id1224459142?ct=epac-web-open-in-app&mt=8&utm_source=epac-web&utm_medium=open-in-app-fallback&utm_campaign=open-in-app">Download epac</a>
      <a class="secondary-link" id="web-link" href="/">Continue on the web</a>
    </section>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var path = params.get("path") || "/";
      var safePath = path.charAt(0) === "/" ? path : "/";
      var storeUrl = new URL("https://apps.apple.com/ca/app/epac/id1224459142");
      storeUrl.searchParams.set("ct", "epac-web-open-in-app");
      storeUrl.searchParams.set("mt", "8");
      storeUrl.searchParams.set("utm_source", "epac-web");
      storeUrl.searchParams.set("utm_medium", "open-in-app-fallback");
      storeUrl.searchParams.set("utm_campaign", "open-in-app");
      storeUrl.searchParams.set("epac_path", safePath);

      var appStoreLink = document.getElementById("app-store-link");
      var webLink = document.getElementById("web-link");
      appStoreLink.href = storeUrl.toString();
      webLink.href = safePath;

      var telemetry = new URL("/app/telemetry/", window.location.origin);
      telemetry.searchParams.set("event", "app-store-redirect");
      telemetry.searchParams.set("path", safePath);
      telemetry.searchParams.set("ts", String(Date.now()));
      var pixel = new Image();
      pixel.src = telemetry.toString();

      window.setTimeout(function () {
        window.location.replace(storeUrl.toString());
      }, 900);
    })();
  </script>
</body>
</html>
