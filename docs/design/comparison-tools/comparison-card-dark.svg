<svg xmlns="http://www.w3.org/2000/svg" width="760" height="264" viewBox="0 0 760 264" role="img" aria-labelledby="title desc">
  <title id="title">Comparison entry card, dark mode</title>
  <desc id="desc">A compact card comparing two MPs with a central similarity score and compare action.</desc>
  <rect width="760" height="264" fill="#000000"/>
  <rect x="28" y="28" width="704" height="208" rx="16" fill="#1c1c1e"/>
  <text x="52" y="66" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#f5f5f7">Compare representatives</text>
  <text x="52" y="94" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="14" fill="#a1a1a6">Based on common recorded votes</text>

  <circle cx="106" cy="156" r="34" fill="#0a84ff" opacity="0.22"/>
  <text x="106" y="166" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#64a8ff">LTR</text>
  <text x="154" y="148" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="19" font-weight="650" fill="#f5f5f7">Leah Taylor Roy</text>
  <rect x="154" y="160" width="72" height="24" rx="12" fill="#ff453a" opacity="0.22"/>
  <text x="190" y="177" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="12" font-weight="650" fill="#ff9f9a">LIB</text>

  <rect x="326" y="112" width="108" height="88" rx="20" fill="#0a84ff" opacity="0.22"/>
  <text x="380" y="148" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="34" font-weight="750" fill="#64a8ff">68%</text>
  <text x="380" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#64a8ff">41 votes</text>

  <circle cx="518" cy="156" r="34" fill="#0a84ff" opacity="0.22"/>
  <text x="518" y="166" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#64a8ff">AL</text>
  <text x="566" y="148" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="19" font-weight="650" fill="#f5f5f7">Andrew Lawton</text>
  <rect x="566" y="160" width="72" height="24" rx="12" fill="#0a84ff" opacity="0.22"/>
  <text x="602" y="177" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="12" font-weight="650" fill="#64a8ff">CPC</text>

  <text x="52" y="216" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="14" fill="#a1a1a6">House of Commons Votes API</text>
  <text x="708" y="216" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="16" font-weight="650" fill="#64a8ff">Compare</text>
</svg>
