<svg xmlns="http://www.w3.org/2000/svg" width="760" height="264" viewBox="0 0 760 264" role="img" aria-labelledby="title desc">
  <title id="title">Comparison entry card, light mode</title>
  <desc id="desc">A compact card comparing two MPs with a central similarity score and compare action.</desc>
  <rect width="760" height="264" fill="#f2f2f7"/>
  <rect x="28" y="28" width="704" height="208" rx="16" fill="#ffffff"/>
  <text x="52" y="66" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#1d1d1f">Compare representatives</text>
  <text x="52" y="94" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="14" fill="#6e6e73">Based on common recorded votes</text>

  <circle cx="106" cy="156" r="34" fill="#0071e3" opacity="0.14"/>
  <text x="106" y="166" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#0071e3">LTR</text>
  <text x="154" y="148" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="19" font-weight="650" fill="#1d1d1f">Leah Taylor Roy</text>
  <rect x="154" y="160" width="72" height="24" rx="12" fill="#d71920" opacity="0.13"/>
  <text x="190" y="177" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="12" font-weight="650" fill="#b3131a">LIB</text>

  <rect x="326" y="112" width="108" height="88" rx="20" fill="#0071e3" opacity="0.12"/>
  <text x="380" y="148" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="34" font-weight="750" fill="#0071e3">68%</text>
  <text x="380" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#0071e3">41 votes</text>

  <circle cx="518" cy="156" r="34" fill="#0071e3" opacity="0.14"/>
  <text x="518" y="166" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#0071e3">AL</text>
  <text x="566" y="148" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="19" font-weight="650" fill="#1d1d1f">Andrew Lawton</text>
  <rect x="566" y="160" width="72" height="24" rx="12" fill="#1a4782" opacity="0.13"/>
  <text x="602" y="177" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="12" font-weight="650" fill="#15396c">CPC</text>

  <text x="52" y="216" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="14" fill="#6e6e73">House of Commons Votes API</text>
  <text x="708" y="216" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="16" font-weight="650" fill="#0071e3">Compare</text>
</svg>
