<svg xmlns="http://www.w3.org/2000/svg" width="430" height="420" viewBox="0 0 430 420" role="img" aria-labelledby="title desc">
  <title id="title">Riding history mini-component, dark mode</title>
  <desc id="desc">A vertical timeline showing current and past MPs for a riding.</desc>
  <rect width="430" height="420" fill="#000000"/>
  <rect x="20" y="28" width="390" height="364" rx="18" fill="#1c1c1e"/>
  <text x="44" y="68" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#f5f5f7">Riding history</text>
  <text x="44" y="94" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="14" fill="#a1a1a6">Newest term first</text>
  <line x1="64" y1="132" x2="64" y2="336" stroke="#38383a" stroke-width="2"/>

  <circle cx="64" cy="142" r="10" fill="#0a84ff"/>
  <text x="92" y="146" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="16" font-weight="650" fill="#f5f5f7">Leah Taylor Roy</text>
  <rect x="276" y="126" width="54" height="24" rx="12" fill="#ff453a" opacity="0.22"/>
  <text x="303" y="143" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="12" font-weight="650" fill="#ff9f9a">LIB</text>
  <text x="92" y="172" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="13" fill="#a1a1a6">2021 to present - current representative</text>

  <circle cx="64" cy="220" r="8" fill="#8e8e93"/>
  <text x="92" y="224" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="16" font-weight="650" fill="#f5f5f7">Leona Alleslev</text>
  <rect x="276" y="204" width="54" height="24" rx="12" fill="#0a84ff" opacity="0.22"/>
  <text x="303" y="221" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="12" font-weight="650" fill="#64a8ff">CPC</text>
  <text x="92" y="250" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="13" fill="#a1a1a6">2015 to 2021</text>

  <circle cx="64" cy="298" r="8" fill="#8e8e93"/>
  <text x="92" y="302" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="16" font-weight="650" fill="#f5f5f7">Costas Menegakis</text>
  <rect x="276" y="282" width="54" height="24" rx="12" fill="#0a84ff" opacity="0.22"/>
  <text x="303" y="299" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="12" font-weight="650" fill="#64a8ff">CPC</text>
  <text x="92" y="328" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="13" fill="#a1a1a6">2011 to 2015</text>

  <text x="44" y="368" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="12" fill="#a1a1a6">Source: House of Commons members data</text>
</svg>
