<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Empty and confidence-floor states, light mode</title>
  <desc id="desc">Two comparison states showing no overlap and insufficient votes for a score.</desc>
  <rect width="760" height="420" fill="#f2f2f7"/>
  <rect x="32" y="44" width="328" height="332" rx="18" fill="#ffffff"/>
  <circle cx="196" cy="136" r="42" fill="#8e8e93" opacity="0.14"/>
  <text x="196" y="151" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="36" font-weight="700" fill="#8e8e93">0</text>
  <text x="196" y="218" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#1d1d1f">No common votes yet.</text>
  <text x="196" y="250" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="15" fill="#6e6e73">These records do not overlap</text>
  <text x="196" y="272" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="15" fill="#6e6e73">enough to compare.</text>
  <text x="196" y="326" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="15" font-weight="650" fill="#0071e3">Browse recent votes</text>

  <rect x="400" y="44" width="328" height="332" rx="18" fill="#ffffff"/>
  <circle cx="564" cy="136" r="42" fill="#0071e3" opacity="0.12"/>
  <text x="564" y="151" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="30" font-weight="750" fill="#0071e3">12</text>
  <text x="564" y="218" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#1d1d1f">Not enough votes</text>
  <text x="564" y="244" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#1d1d1f">for a score.</text>
  <text x="564" y="278" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="15" fill="#6e6e73">Show shared votes, but hold</text>
  <text x="564" y="300" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="15" fill="#6e6e73">the score until the sample grows.</text>
  <text x="564" y="342" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="13" fill="#6e6e73">Minimum threshold: 20 common votes</text>
</svg>
