<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Empty and confidence-floor states, dark mode</title>
  <desc id="desc">Two comparison states showing no overlap and insufficient votes for a score.</desc>
  <rect width="760" height="420" fill="#000000"/>
  <rect x="32" y="44" width="328" height="332" rx="18" fill="#1c1c1e"/>
  <circle cx="196" cy="136" r="42" fill="#8e8e93" opacity="0.22"/>
  <text x="196" y="151" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="36" font-weight="700" fill="#a1a1a6">0</text>
  <text x="196" y="218" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#f5f5f7">No common votes yet.</text>
  <text x="196" y="250" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="15" fill="#a1a1a6">These records do not overlap</text>
  <text x="196" y="272" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="15" fill="#a1a1a6">enough to compare.</text>
  <text x="196" y="326" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="15" font-weight="650" fill="#64a8ff">Browse recent votes</text>

  <rect x="400" y="44" width="328" height="332" rx="18" fill="#1c1c1e"/>
  <circle cx="564" cy="136" r="42" fill="#0a84ff" opacity="0.22"/>
  <text x="564" y="151" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="30" font-weight="750" fill="#64a8ff">12</text>
  <text x="564" y="218" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#f5f5f7">Not enough votes</text>
  <text x="564" y="244" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#f5f5f7">for a score.</text>
  <text x="564" y="278" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="15" fill="#a1a1a6">Show shared votes, but hold</text>
  <text x="564" y="300" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="15" fill="#a1a1a6">the score until the sample grows.</text>
  <text x="564" y="342" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif" font-size="13" fill="#a1a1a6">Minimum threshold: 20 common votes</text>
</svg>
