<text x="284" y="1401" font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="500" fill="#6E6E73">Canadian Economy Act.</text>
            

            <rect x="385" y="1480" width="710" height="166" rx="30" fill="#E8F2FF" stroke="#E5E5EA" stroke-width="2"/>
