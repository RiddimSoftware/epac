    <text x="204" y="1196" font-family="Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="900" fill="#1C1C1E">Hansard</text>
    
            <rect x="192" y="1270" width="710" height="166" rx="30" fill="#F2F2F7" stroke="#E5E5EA" stroke-width="2"/>
