  <text x="92" y="392" font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="100" font-weight="900" fill="#FFFFFF">Parliament in your</text>
<text x="92" y="500" font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="100" font-weight="900" fill="#FFFFFF">pocket</text>
  <text x="96" y="600" font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="500" fill="#DCE8F8">Read official House debates in a</text>
<text x="96" y="656" font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="500" fill="#DCE8F8">format built for scanning.</text>

